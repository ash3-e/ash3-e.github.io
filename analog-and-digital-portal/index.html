<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analog &amp; Digital Portal</title>
  <meta name="description" content="PHYS 0525 Analog &amp; Digital Electronics Portal with searchable note transcripts, rendered equations, and a full-screen PDF viewer.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style>
:root{
  --bg:#030a06;
  --bg2:#081410;
  --panel:rgba(8,18,12,.84);
  --panel-soft:rgba(12,22,16,.78);
  --panel-strong:rgba(4,12,8,.92);
  --edge:rgba(20,90,50,.35);
  --edge-strong:rgba(40,140,80,.28);
  --text:#f0f8f2;
  --muted:rgba(210,235,220,.76);
  --muted-2:rgba(210,235,220,.55);
  --green-bright:#7fffaa;
  --green-mid:#5fdc88;
  --green-dim:rgba(40,200,110,.10);
  --green-glow:rgba(80,255,150,.18);
  --shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(120,255,170,.04);
  --blur:22px;
  --radius-xl:28px;
  --radius-lg:24px;
  --radius-md:18px;
  --site-pad:16px;
  --topbar-space:0px;
  --surface-glass:
    linear-gradient(180deg, rgba(0,0,0,.34), rgba(0,0,0,.46)),
    linear-gradient(135deg, rgba(40,180,90,.045), transparent 34%, rgba(20,120,60,.045));
  --surface-inner:
    linear-gradient(180deg, rgba(0,0,0,.24), rgba(0,0,0,.34)),
    linear-gradient(135deg, rgba(40,180,90,.045), transparent 34%, rgba(20,120,60,.045));
  --pdf-zoom:1;
  --pdf-fit-scale:1;
  --pdf-total-zoom:1;
}
*{box-sizing:border-box}
html{margin:0;width:100%;height:100%;overflow-x:hidden;overscroll-behavior:none}
body{
  margin:0;
  width:100%;
  min-height:100vh;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  font-family:Inter,"Segoe UI",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 14%, rgba(95,175,255,.18), transparent 22%),
    radial-gradient(circle at 82% 12%, rgba(192,134,255,.14), transparent 24%),
    linear-gradient(180deg,#030508 0%,#07101c 44%,#03070d 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    linear-gradient(135deg, rgba(255,255,255,.05), transparent 16%, transparent 74%, rgba(255,255,255,.03)),
    radial-gradient(circle at 50% -10%, rgba(255,255,255,.04), transparent 44%);
}
#scopeCanvas{position:fixed;inset:0;z-index:1;pointer-events:auto;filter:contrast(1.08) saturate(1.15) brightness(1.02)}
#scopeStatus{
  position:fixed;
  bottom:0;
  left:0;right:0;
  z-index:3;
  display:flex;
  justify-content:space-between;
  padding:6px 16px;
  font:10px/1.3 ui-monospace,'SF Mono',Menlo,monospace;
  color:rgba(110,240,160,.6);
  pointer-events:none;
  text-shadow:0 0 6px rgba(80,255,150,.3);
  background:var(--surface-glass);
  backdrop-filter:blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border-top:1px solid var(--edge);
  transition:bottom .25s ease;
}
#scopeStatus .scope-left,
#scopeStatus .scope-right{white-space:nowrap}
.app{
  position:relative;
  z-index:2;
  width:100vw;
  height:100vh;
  overflow:hidden;
  display:grid;
  grid-template-rows:minmax(0,1fr);
  gap:0;
  align-items:stretch;
  padding-top:var(--topbar-space);
}
body.viewer-open .app{
  visibility:hidden;
  pointer-events:none;
}
.glass{
  background:var(--surface-glass);
  backdrop-filter:blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
}
.portal-topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:12;
  padding:0 var(--site-pad);
  pointer-events:none;
}
.portal-header{
  position:relative;
  display:grid;
  grid-template-columns:minmax(220px,max-content) max-content minmax(420px,1fr);
  gap:14px 18px;
  align-items:center;
  padding:12px 16px;
  border-radius:0 0 20px 20px;
  pointer-events:auto;
}
.portal-title{
  margin:0;
  font-size:1.4rem;
  font-weight:800;
  letter-spacing:.02em;
  line-height:1;
  color:#ffffff;
  text-shadow:0 0 12px rgba(100,255,160,.50), 0 0 28px rgba(80,220,140,.30), 0 0 60px rgba(60,200,120,.15);
  align-self:center;
}
.search-shell{
  position:relative;
  grid-column:3;
  grid-row:1;
  width:100%;
  border-radius:16px;
  padding:4px;
  background:
    linear-gradient(180deg, rgba(120,255,170,.10), rgba(0,0,0,.08)),
    linear-gradient(135deg, rgba(40,180,90,.12), rgba(20,120,60,.14));
  border:1px solid rgba(40,180,90,.22);
  box-shadow:
    inset 0 1px 0 rgba(120,255,170,.10),
    0 8px 24px rgba(0,0,0,.28);
}
.search-row{
  position:relative;
  display:flex;
  gap:10px;
  align-items:center;
  border-radius:12px;
  background:
    linear-gradient(180deg, rgba(120,255,170,.06), rgba(0,0,0,.10)),
    linear-gradient(135deg, rgba(20,60,35,.72), rgba(15,50,30,.68));
  box-shadow:
    inset 0 1px 0 rgba(120,255,170,.10),
    inset 0 0 0 1px rgba(120,255,170,.05);
}
.search-icon{
  position:absolute;
  left:14px;
  top:50%;
  width:17px;
  height:17px;
  transform:translateY(-50%);
  opacity:.82;
  filter:brightness(0) invert(1);
  pointer-events:none;
}
.search-input{
  width:100%;
  min-width:0;
  height:42px;
  padding:0 116px 0 40px;
  border-radius:12px;
  border:none;
  background:transparent;
  color:#f0f8f2;
  font-size:.97rem;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
}
.search-input::-webkit-search-cancel-button{display:none}
.search-input::placeholder{color:rgba(200,240,210,.56)}
.search-input:focus{box-shadow:none}
.search-clear{
  position:absolute;
  right:52px;
  top:50%;
  width:30px;
  height:30px;
  padding:8px;
  transform:translateY(-50%);
  display:grid;
  place-items:center;
  border-radius:10px;
  border:1px solid var(--edge);
  background:rgba(120,255,170,.06);
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease, background .18s ease;
}
.search-clear img{
  width:100%;
  height:100%;
  display:block;
  filter:brightness(0) invert(1);
}
.search-shell.search-has-query .search-clear{opacity:1;pointer-events:auto}
.search-clear:hover{background:rgba(120,255,170,.12)}
.search-submit{
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  height:30px;
  width:40px;
  padding:0;
  border-radius:10px;
  border:1px solid rgba(40,180,90,.26);
  background:rgba(120,255,170,.08);
  color:var(--text);
  font-weight:700;
  font-size:.78rem;
  cursor:pointer;
}
.search-submit:hover{background:rgba(120,255,170,.14)}
.meta-row{display:flex;flex-wrap:wrap;gap:10px}
.portal-pills{
  grid-column:2;
  grid-row:1;
  justify-self:start;
  justify-content:flex-start;
  flex-wrap:nowrap;
  gap:8px;
  width:auto;
  min-width:0;
  max-width:100%;
}
.pill{
  padding:9px 13px;
  border-radius:999px;
  background:rgba(40,200,110,.06);
  border:1px solid rgba(40,200,110,.18);
  color:rgba(180,255,210,.72);
  font-size:.88rem;
  white-space:nowrap;
}
.content-shell{min-height:0;padding:var(--site-pad) var(--site-pad) 34px var(--site-pad)}
.content{
  min-height:0;
  height:100%;
  align-self:stretch;
  display:grid;
  grid-template-columns:minmax(290px,.95fr) minmax(290px,.95fr) minmax(420px,1.35fr);
  gap:16px;
  overflow:hidden;
}
.notes-column{
  display:grid;
  grid-template-rows:minmax(0,1fr);
  min-height:0;
  height:100%;
  overflow:hidden;
  padding:12px;
  border-radius:var(--radius-lg);
  background:var(--surface-glass);
  backdrop-filter:blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
}
.list-stack{
  display:grid;
  grid-template-rows:minmax(0,1fr) minmax(0,1fr);
  gap:16px;
  min-height:0;
  height:100%;
  overflow:hidden;
  padding:12px;
  border-radius:var(--radius-lg);
  background:var(--surface-glass);
  backdrop-filter:blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
}
.card{
  min-height:0;
  height:100%;
  overflow:hidden;
  border-radius:var(--radius-lg);
  padding:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
}
.collapsible-card{
  background:var(--surface-glass);
  backdrop-filter:blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
}
.list-stack > .collapsible-card{
  background:var(--surface-inner);
  box-shadow:inset 0 1px 0 rgba(120,255,170,.04), 0 10px 28px rgba(0,0,0,.24);
}
#notesCard{
  background:var(--surface-inner);
  box-shadow:inset 0 1px 0 rgba(120,255,170,.04), 0 10px 28px rgba(0,0,0,.24);
}
.card-head{padding:16px 18px 12px;border-bottom:1px solid rgba(40,180,90,.12)}
.card-head > div {min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.collapsible-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.preview-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{margin:0;font-size:1.25rem;line-height:1.1;color:#ffffff;text-shadow:0 0 12px rgba(100,255,160,.50), 0 0 28px rgba(80,220,140,.30), 0 0 60px rgba(60,200,120,.15)}
.card-sub{margin:0;color:var(--muted-2);font-size:.88rem;line-height:1.35}
.mobile-section-toggle{
  display:none;
  flex:0 0 auto;
  width:34px;
  height:30px;
  padding:0;
  place-items:center;
  border-radius:10px;
  color:var(--green-bright);
  background:
    linear-gradient(180deg, rgba(120,255,170,.10), rgba(0,0,0,.10)),
    linear-gradient(135deg, rgba(40,180,90,.12), rgba(20,120,60,.14));
  border:1px solid rgba(40,180,90,.22);
  box-shadow:
    inset 0 1px 0 rgba(120,255,170,.08),
    0 8px 20px rgba(0,0,0,.24);
  cursor:pointer;
}
.mobile-section-toggle svg{
  width:17px;
  height:17px;
  transition:transform .28s ease;
}
.mobile-preview-close{
  appearance:none;
  border:none;
  display:none;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:8px 12px;
  border-radius:12px;
  color:var(--text);
  background:rgba(120,255,170,.08);
  border:1px solid var(--edge);
  font-weight:700;
  cursor:pointer;
}
.mobile-preview-close:hover{background:rgba(120,255,170,.12)}
.card-body{
  min-height:0;
  height:100%;
  overflow:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:12px 12px 14px;
  scrollbar-width:thin;
  scrollbar-color:rgba(80,200,120,.40) transparent;
}
.card-body::-webkit-scrollbar{width:12px}
.card-body::-webkit-scrollbar-track{background:rgba(120,255,170,.04);border-radius:999px}
.card-body::-webkit-scrollbar-thumb{
  background:rgba(80,200,120,.55);
  border-radius:999px;
  border:2px solid rgba(0,0,0,.10);
  background-clip:padding-box;
}
.doc-list{display:flex;flex-direction:column;gap:10px}
.doc-card{
  padding:14px 14px 13px;
  border-radius:18px;
  background:
    linear-gradient(180deg, rgba(120,255,170,.04), rgba(0,0,0,.12)),
    linear-gradient(135deg, rgba(40,180,90,.06), transparent 36%, rgba(20,120,60,.06));
  backdrop-filter:blur(calc(var(--blur) * .72)) saturate(145%);
  -webkit-backdrop-filter:blur(calc(var(--blur) * .72)) saturate(145%);
  border:1px solid rgba(20,90,50,.28);
  box-shadow:inset 0 1px 0 rgba(120,255,170,.04), 0 10px 28px rgba(0,0,0,.28);
  cursor:pointer;
  transition:transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
}
.doc-card:hover{
  transform:translateY(-1px);
  border-color:rgba(80,220,130,.34);
  background:
    linear-gradient(180deg, rgba(120,255,170,.07), rgba(0,0,0,.10)),
    linear-gradient(135deg, rgba(40,180,90,.09), transparent 36%, rgba(20,120,60,.08));
  box-shadow:inset 0 1px 0 rgba(120,255,170,.06), 0 12px 30px rgba(0,0,0,.30);
}
.doc-card.active{
  background:
    linear-gradient(180deg, rgba(60,200,120,.14), rgba(0,0,0,.12)),
    linear-gradient(135deg, rgba(80,220,130,.12), transparent 36%, rgba(20,120,60,.10));
  border-color:rgba(80,220,130,.36);
  box-shadow:inset 0 1px 0 rgba(120,255,170,.08), 0 14px 32px rgba(40,180,90,.14);
}
.doc-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.doc-name-wrap{min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.doc-name{font-weight:700;line-height:1.2;color:#ffffff;min-width:0;word-break:break-word;}
.doc-pages{font-size:.78rem;color:var(--muted-2)}
.doc-kind{
  flex:0 0 auto;
  padding:6px 10px;
  border-radius:999px;
  font-size:.72rem;
  letter-spacing:.02em;
  color:rgba(180,255,210,.72);
  background:rgba(40,200,110,.06);
  border:1px solid rgba(40,200,110,.18);
}
.doc-snippet{
  font-size:.88rem;
  line-height:1.42;
  color:var(--muted);
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-align:justify;
  text-align-last:left;
}
.doc-actions{display:flex;gap:8px;margin-top:10px}
.doc-mini-btn{
  appearance:none;
  border:none;
  text-decoration:none;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:34px;
  padding:8px 10px;
  border-radius:12px;
  font-weight:700;
  color:var(--text);
  background:rgba(120,255,170,.06);
  border:1px solid var(--edge);
  font-size:.8rem;
}
.doc-mini-btn:hover{background:rgba(120,255,170,.10)}
.doc-mini-btn svg{width:14px;height:14px;opacity:.95}
mark{
  background:rgba(120,255,170,.18);
  color:#dfffeb;
  padding:0 .12em;
  border-radius:.28em;
  box-shadow:0 0 0 1px rgba(120,255,170,.18) inset;
}
.preview-wrap{display:flex;flex-direction:column;gap:14px;min-height:0}
.preview-empty{min-height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.mobile-hint-card{
  display:none;
  padding:11px 10px;
  border-radius:20px;
  color:var(--green-bright);
  font-size:clamp(.58rem, 2.7vw, .78rem);
  font-weight:800;
  letter-spacing:0;
  line-height:1;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
}
.preview-block{
  padding:14px 16px;
  border-radius:18px;
  background:var(--surface-inner);
  backdrop-filter:blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
}
.selected-doc-block{position:relative;padding-right:72px}
.selected-save-btn{
  position:absolute;
  top:14px;
  right:16px;
  width:44px;
  height:44px;
  padding:0;
  display:grid;
  place-items:center;
  border-radius:14px;
}
.selected-save-btn img{width:17px;height:17px}
.section-label{
  font-size:.76rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--green-mid);
  margin-bottom:10px;
}
.summary{color:var(--muted);line-height:1.55}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.k-chip{
  padding:7px 10px;
  border-radius:999px;
  background:rgba(40,200,110,.06);
  border:1px solid rgba(40,200,110,.14);
  color:var(--muted);
  font-size:.8rem;
}
.action-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{
  appearance:none;
  border:none;
  text-decoration:none;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:11px 14px;
  border-radius:14px;
  font-weight:700;
  color:var(--text);
  background:rgba(120,255,170,.06);
  border:1px solid var(--edge);
}
.btn:hover{background:rgba(120,255,170,.10)}
.btn.primary{
  background:linear-gradient(135deg, rgba(60,200,120,.22), rgba(40,160,90,.16));
  border-color:rgba(60,200,120,.28);
  box-shadow:0 0 18px rgba(80,255,150,.08);
}
.btn.primary:hover{
  background:linear-gradient(135deg, rgba(60,200,120,.30), rgba(40,160,90,.22));
  box-shadow:0 0 24px rgba(80,255,150,.12);
}
.btn svg{width:16px;height:16px;opacity:.95}
.btn img{width:16px;height:16px;opacity:.95;filter:brightness(0) invert(1);flex:0 0 auto}
.equation-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.eq-card{
  padding:12px 14px;
  border-radius:16px;
  background:
    linear-gradient(180deg, rgba(120,255,170,.04), rgba(0,0,0,.12)),
    linear-gradient(135deg, rgba(40,180,90,.06), transparent 36%, rgba(20,120,60,.06));
  backdrop-filter:blur(calc(var(--blur) * .72)) saturate(145%);
  -webkit-backdrop-filter:blur(calc(var(--blur) * .72)) saturate(145%);
  border:1px solid rgba(20,90,50,.28);
  box-shadow:inset 0 1px 0 rgba(120,255,170,.04), 0 10px 28px rgba(0,0,0,.28);
}
.eq-render{min-height:32px;color:#dfffeb;overflow:hidden}
.eq-render .katex{font-size:1rem}
.eq-render .katex-display{margin:0;overflow:hidden}
.eq-plain{
  margin-top:8px;
  color:var(--muted-2);
  font-size:.74rem;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.transcript{
  font-family:Inter,"Segoe UI",system-ui,sans-serif;
  font-size:.93rem;
  line-height:1.65;
  color:rgba(220,245,230,.92);
  max-height:360px;
  overflow:auto;
  padding-right:6px;
}
body:not(.portal-mobile-view) .transcript{
  max-height:none;
  overflow:visible;
  padding-right:0;
}
.transcript-heading{margin:0 0 10px;font-size:1rem;line-height:1.25;font-weight:800;color:#ffffff}
.transcript-p{margin:0 0 12px;color:rgba(220,245,230,.92)}
.transcript-math{
  margin:10px 0 14px;
  padding:10px 12px;
  border-radius:14px;
  background:rgba(120,255,170,.035);
  border:1px solid rgba(40,180,90,.12);
  overflow:auto;
}
.transcript-inline-math{display:inline-flex;align-items:center;vertical-align:middle;padding:0 .1em}
.transcript-punct{color:rgba(220,245,230,.92)}
.viewer-overlay{
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(2,8,4,.68);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .22s ease, visibility .22s ease;
}
.viewer-overlay.open{opacity:1;visibility:visible;pointer-events:auto}
body:not(.portal-mobile-view) .viewer-overlay.open{
  background:rgba(2,8,4,.24);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}
.viewer-shell{
  position:absolute;
  inset:18px;
  border-radius:28px;
  overflow:hidden;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  background:rgba(4,12,8,.94);
  border:1px solid var(--edge);
  box-shadow:0 24px 80px rgba(0,0,0,.55);
}
body:not(.portal-mobile-view) .viewer-shell{
  background:rgba(4,12,8,.78);
  backdrop-filter:blur(6px) saturate(135%);
  -webkit-backdrop-filter:blur(6px) saturate(135%);
}
.viewer-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;

  } catch (error) {
    pdfjsLoadError = error;
    throw error;
  }
}

const iconOpen = () => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5"/><path d="M10 14L19 5"/><path d="M19 13v6H5V5h6"/></svg>';

function normalize(s = "") {

function isSplitView() {
  const width = window.innerWidth || 0;
  if (width < 600) return false;
  if (width <= 1120) return true;
  const screenWidth = window.screen?.width || 1920;
  return width <= Math.round(screenWidth * 0.55);

function syncMobilePreviewState() {

function syncResponsiveMode() {

function getDoc(id) {
  return DOCS.find((d) => d.id === id) || null;
}

function getSelected() {
  return getDoc(state.selectedId) || DOCS[0] || null;
}

function filteredDocs(category) {
  const q = normalize(state.query).trim();
  const list = DOCS.filter((d) => d.category === category);
  if (!q) return list;
  return list.filter((doc) => normalize([doc.title, doc.summary, doc.searchPlain, doc.searchText, doc.transcriptPlain].join(" ")).includes(q));
}

function snippetFor(doc) {
  const basis = doc.transcriptPlain || doc.summary || doc.searchPlain || "";
  const q = normalize(state.query).trim();
  const text = basis.replace(/\s+/g, " ").trim();
  if (!q || !text) return text.slice(0, 220);
  const idx = normalize(text).indexOf(q);
  if (idx < 0) return text.slice(0, 220);
  const start = Math.max(0, idx - 90);
  const end = Math.min(text.length, idx + q.length + 130);
  return (start ? "... " : "") + text.slice(start, end) + (end < text.length ? " ..." : "");
}

function highlight(text) {
  const q = state.query.trim();
  if (!q) return renderSubscripts(text);
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
  let html = "";
  let last = 0;
  let m;
  while ((m = rx.exec(text)) !== null) {
    html += renderSubscripts(text.slice(last, m.index));
    html += `<mark>${escapeHtml(m[0])}</mark>`;
    last = m.index + m[0].length;
  }
  html += renderSubscripts(text.slice(last));
  return html;
}

function ensureSelection() {
  if (getSelected()) return;
  const fallback = [...filteredDocs("notes"), ...filteredDocs("assignments"), ...filteredDocs("labs")][0];
  state.selectedId = fallback?.id || null;

function kindLabel(cat) {

function resetPreviewScroll() {

function scheduleMobilePreviewScroll() {

function scrollMobilePreviewIntoPlace(behavior = "smooth") {
  const preview = document.getElementById("previewCard");
  const topbar = document.querySelector(".portal-topbar");
  if (!preview) return;
  const topbarH = topbar ? topbar.offsetHeight : 0;
  preview.style.scrollMarginTop = (topbarH + 18) + "px";
  const scroller = getPortalScroller();
  if (document.body.classList.contains("portal-mobile-view") && scroller) {
    const scrollerTop = scroller.getBoundingClientRect().top;
    const previewTop = preview.getBoundingClientRect().top;
    const targetTop = scroller.scrollTop + previewTop - scrollerTop - topbarH - 18;
    scroller.scrollTo({ top: Math.max(0, targetTop), left: 0, behavior });
    return;
  }
  preview.scrollIntoView({ behavior, block: "start" });

function renderEquation(tex = "") {
  const display = normalizeEquationForDisplay(tex);
  if (window.katex) {
    const wrap = document.createElement("div");
    try {
      window.katex.render(display.tex, wrap, { throwOnError: true, displayMode: true });
    } catch {
      return "";
    }
    return wrap.innerHTML;
  }
  return "";
}

function renderMathFragment(tex = "", displayMode = false) {
  const wrap = document.createElement(displayMode ? "div" : "span");
  if (window.katex) {
    try {
      window.katex.render(tex, wrap, { throwOnError: true, displayMode });
    } catch {
      return "";
    }
  } else {
    return "";
  }
  if (!displayMode) wrap.classList.add("transcript-inline-math");
  return wrap.outerHTML;
}

function latexTextToPlain(text = "") {
  return String(text || "")
    .replace(/\\,/g, " ")
    .replace(/\\ /g, " ")
    .replace(/\\Omega/g, "ohm")
    .replace(/\\mu/g, "micro")
    .replace(/\\circ/g, "deg")
    .replace(/V_\{CC\}/g, "VCC")
    .replace(/\s+/g, " ")
    .trim();
}

function replaceLatexTextCommands(tex = "", replacer = () => "") {
  const source = String(tex || "");
  let out = "";
  for (let i = 0; i < source.length; i += 1) {
    if (!source.startsWith("\\text{", i)) {
      out += source[i];
      continue;
    }
    let depth = 1;
    let j = i + 6;
    while (j < source.length && depth > 0) {
      if (source[j] === "{") depth += 1;
      else if (source[j] === "}") depth -= 1;
      j += 1;
    }
    if (depth !== 0) {
      out += source.slice(i);
      break;
    }
    const content = source.slice(i + 6, j - 1);
    out += replacer(content, i, source);
    i = j - 1;
  }
  return out;
}

function titleCaseWords(text = "") {
  return String(text || "")
    .replace(/[_{}\\]/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .split(" ")
    .filter(Boolean)
    .map((word) => word.length <= 3 && /^[A-Z0-9]+$/.test(word)
      ? word
      : word[0].toUpperCase() + word.slice(1).toLowerCase())
    .join(" ");
}

function normalizeEquationDetail(text = "") {
  return latexTextToPlain(text)
    .replace(/^[(:\s]+|[):\s]+$/g, "")
    .replace(/\bbar\s+v\b/ig, "average V")
    .replace(/\bvs\b/g, "VS")
    .replace(/\bvcc\b/ig, "VCC")
    .replace(/\bgnd\b/ig, "GND")
    .replace(/\s+/g, " ")
    .trim();
}

function conciseDetail(text = "") {
  const plain = normalizeEquationDetail(text)
    .replace(/\bexample\b:?/ig, "")
    .replace(/transistor amplifies arduino base current/ig, "base drives collector")
    .replace(/current gain from collector and base currents/ig, "current gain")
    .replace(/load current achievable through collector/ig, "collector load limit")
    .replace(/thermocouple voltage change/ig, "voltage change")
    .replace(/measured from V_\{pp\} drop across base resistor/ig, "base resistor drop")
    .replace(/output impedance reduced by.*$/ig, "reduced output impedance")
    .replace(/UNO has 2 hardware interrupts.*$/ig, "hardware interrupts")
    .replace(/Trigger modes.*$/ig, "interrupt trigger modes")
    .replace(/Volatile globals required.*$/ig, "ISR shared state")
    .replace(/\bwith sign convention\b/ig, "sign convention")
    .replace(/\bi\.e\.\b/ig, "")
    .replace(/\s+/g, " ")
    .trim();
  if (!plain) return "";
  const first = plain.split(/[.;]/)[0].trim();
  const words = first.split(/\s+/).filter(Boolean);
  return words.slice(0, 9).join(" ");
}

function hasSymbolicVariable(tex = "") {
  return /[A-Za-z](?![a-z]*\})/.test(String(tex || "")
    .replace(/\\(?:mathrm|text)\{[^}]*\}/g, "")
    .replace(/\\(?:frac|sqrt|left|right|cdot|times|approx|le|ge|lfloor|rfloor|text|mathrm|Omega|mu|circ|quad|qquad|Rightarrow|to|in|sim|propto|max|min)\b/g, "")
    .replace(/\b(?:V|A|Hz|mA|LEDs?|ohm|W|K|C|rad|s|ft|nanosecond)\b/g, ""));
}

function segmentLooksNumeric(tex = "") {
  const segment = String(tex || "")
    .replace(/\\(?:mathrm|text)\{[^}]*\}/g, "")
    .split(/,|;|\\quad|\\qquad|\\Rightarrow/)[0] || "";
  if (!/\d/.test(segment)) return false;
  if (/\\frac\{[-+\d.\s\\!\\cdot\\times\^{}]+\}\{[-+\d.\s\\!\\cdot\\times\^{}]+\}/.test(segment)) return true;
  if (/^\s*[-+]?[\d.]/.test(segment) && !hasSymbolicVariable(segment)) return true;
  return false;
}

function stripNumericSubstitutionTail(tex = "") {
  const source = String(tex || "");
  const relation = /(=|\\approx|\\simeq|\\sim)/g;
  let match;
  while ((match = relation.exec(source)) !== null) {
    const rhs = source.slice(match.index + match[0].length);
    if (segmentLooksNumeric(rhs)) {
      const left = source.slice(0, match.index).trim().replace(/[,\s\\quad\\qquad]+$/g, "");
      return /=|\\approx|\\sim|\\le|\\ge|<|>|\\Rightarrow|\\propto/.test(left) ? left : source;
    }
  }
  return source;
}

function splitTopLevelRelations(tex = "") {
  return String(tex || "")
    .split(/\\qquad|\\quad|;|,(?=\\?\s*[A-Za-z\\])/)
    .map((part) => part.trim())
    .filter(Boolean);
}

function relationCount(tex = "") {
  return (String(tex || "").match(/=|\\approx|\\sim|\\le|\\ge|<|>|\\Rightarrow|\\to|\\propto/g) || []).length;
}

function truncateExcessRelations(tex = "") {
  const source = String(tex || "");
  const matches = [...source.matchAll(/=|\\approx|\\sim|\\le|\\ge|<|>|\\Rightarrow|\\to|\\propto/g)];
  if (matches.length <= 2) return source;
  return source.slice(0, matches[2].index).trim();
}

function choosePrimaryRelation(tex = "") {
  const parts = splitTopLevelRelations(tex);
  if (parts.length <= 1) return tex;
  const relationParts = parts.filter((part) => relationCount(part));
  if (!relationParts.length) return parts[0];
  const symbolic = relationParts.filter((part) => hasSymbolicVariable(part) && !segmentLooksNumeric(part));
  return (symbolic[0] || relationParts[0]).replace(/^[,: ]+|[,: ]+$/g, "");
}

function normalizeKnownValuedEquation(tex = "") {
  const raw = String(tex || "");
  if (/V_\{out\}\^\{\\text\{DAC\}\}|A_\{3\}.*A_\{0\}/.test(raw)) {
    return {
      tex: "V_{out}^{DAC}=\\sum_{n=0}^{N-1}w_{n}A_{n}",
      detail: "weighted DAC output",
    };
  }
  if (/R_\{TOT\}|R_\{1\}\+R_\{2\}|R_\{th\}|V_\{th\}/.test(raw) && /\\Omega|\\text\{V\}|\\cdot/.test(raw)) {
    return {
      tex: raw.includes("V_{th}") ? "V_{th}=V\\frac{R_{2}}{R_{1}+R_{2}}" : raw.includes("R_{th}") ? "R_{th}=R_{eq}+R_{s}" : "R_{eq}=f(R_{1},R_{2})",
      detail: "symbolic circuit relation",
    };
  }
  if (/\\text\{(?:AND|NAND|NOT|OR)\}|(?:AND|NAND|NOT|OR)\(A/.test(raw)) {
    const name = raw.match(/(?:AND|NAND|NOT|OR)/)?.[0] || "Logic";
    const tex = name === "NOT"
      ? "\\operatorname{NOT}(A)=\\bar A"
      : name === "AND"
        ? "\\operatorname{AND}(A,B)=A\\cdot B"
        : name === "NAND"
          ? "\\operatorname{NAND}(A,B)=\\overline{A\\cdot B}"
          : "\\operatorname{OR}(A,B)=A+B";
    return { tex, detail: "truth table rule" };
  }
  if (/V_\{BE\}\\approx|V_\{BC\}\\approx/.test(raw)) {
    const symbol = /V_\{BC\}/.test(raw) ? "V_{BC}" : "V_{BE}";
    return {
      tex: `${symbol}\\approx V_{D}`,
      detail: "forward junction drop",
    };
  }
  if (/V_\{out,\\text\{bridge\}\}/.test(raw)) {
    return {
      tex: "V_{out}=|V_{in}|-2V_{D}",
      detail: "full-wave rectifier output",
    };
  }
  if (/Half-wave w\/ filter/.test(raw)) {
    return {
      tex: "V_{out}\\approx V_{max}\\left(1-\\frac{t}{RC}\\right)",
      detail: "filtered half-wave output",
    };
  }
  if (/\\Delta V=V_\{max\}.*I_\{max\}\/fC/.test(raw)) {
    return {
      tex: "\\Delta V\\approx \\frac{I_{max}}{fC}",
      detail: "ripple estimate",
    };
  }
  if (/A_\{OL\}.*\\xrightarrow/.test(raw)) {
    return {
      tex: "V_{out}=\\left(1+\\frac{R_{1}}{R_{2}}\\right)V_{in}",
      detail: "closed-loop non-inverting gain",
    };
  }
  if (/Properties:.*Z_\{in\}/.test(raw)) {
    return {
      tex: "Z_{in}\\to\\infty,\\quad Z_{out}\\to 0",
      detail: "ideal op-amp impedance limits",
    };
  }
  if (/V_\{b\}=\\pm V_\{S\}/.test(raw)) {
    return {
      tex: "V_{b}=\\pm V_{S}\\frac{R_{1}}{R_{1}+R_{2}}",
      detail: "Schmitt trigger thresholds",
    };
  }
  if (/555 thresholds/.test(raw)) {
    return {
      tex: "V_{upper}=\\frac{2}{3}V_{S},\\quad V_{lower}=\\frac{1}{3}V_{S}",
      detail: "555 timer thresholds",
    };
  }
  if (/Logic levels/.test(raw)) {
    return {
      tex: "0\\to V_{L},\\quad 1\\to V_{H}",
      detail: "digital logic voltage levels",
    };
  }
  if (/AND\(A,B\)|NAND\(A,B\)|NOT\(A\)|OR\(A,B\)/.test(raw)) {
    const op = raw.match(/(?:AND|NAND|NOT|OR)\(A(?:,B)?\)/)?.[0] || "Logic";
    return {
      tex: raw.includes("\\bar") ? `${op}=\\overline{A\\cdot B}` : raw.includes("\\cdot") ? `${op}=A\\cdot B` : `${op}=f(A,B)`,
      detail: "truth table rule",
    };
  }
  if (/I_\{d,\\text\{sat\}\}/.test(raw)) {
    return {
      tex: "I_{d,sat}=K\\left(V_{GS}-V_{p}\\right)^{2}",
      detail: "JFET saturation current",
    };
  }
  if (/\\sqrt\{I_\{d,\\text\{sat\}\}\}/.test(raw)) {
    return {
      tex: "\\sqrt{I_{d,sat}}=\\sqrt{K}\\left(V_{GS}-V_{p}\\right)",
      detail: "linearized JFET relation",
    };
  }
  if (/Slope of.*I_\{d,\\text\{sat\}\}/.test(raw)) {
    return {
      tex: "m=\\sqrt{K}",
      detail: "slope of linearized JFET plot",
    };
  }
  if (/x-intercept.*I_\{d,\\text\{sat\}\}/.test(raw)) {
    return {
      tex: "V_{GS}=V_{p}",
      detail: "x-intercept of linearized JFET plot",
    };
  }
  if (/\\sqrt\{I_\{d\}\}.*\\Rightarrow/.test(raw)) {
    return {
      tex: "\\sqrt{I_{d}}=\\sqrt{K}\\left(V_{GS}-V_{p}\\right)",
      detail: "linearized JFET fit equation",
    };
  }
  if (/V_\{BE\}\\approx V_\{D\}/.test(raw)) {
    return {
      tex: "V_{BE}\\approx V_{D}",
      detail: "forward junction drop",
    };
  }
  if (/For\\s+R|with sign convention|V_\{out\}.*\\Rightarrow.*\\to/.test(raw)) {
    return {
      tex: "V_{out}=G\\,V_{in}",
      detail: "output from input gain relation",

  }
  if (/k_\{B\}T\/e\\approx/.test(raw)) {
    return {
      tex: "V_{T}=\\frac{k_{B}T}{e}",
      detail: "thermal voltage",
    };
  }
  if (/I_\{LED\}=\\frac\{V_\{R_\{330\}\}\}/.test(raw)) {
    return {
      tex: "I_{LED}=\\frac{V_{R,LED}}{R_{LED}}",
      detail: "LED current from voltage drop",
    };
  }
  if (/Arduino limit per pin/i.test(raw)) {
    return {
      tex: "I_{pin}\\le I_{pin,\\max};\\quad I_{rail}\\le I_{rail,\\max}",
      detail: "pin and rail limits",
    };
  }
  if (/Max LEDs from a single I\/O pin/i.test(raw)) {
    return {
      tex: "N_{LED,\\max}=\\left\\lfloor\\frac{I_{pin,\\max}}{I_{LED}}\\right\\rfloor",
      detail: "single-pin LED limit",
    };
  }
  if (/Example:/i.test(raw) && /per LED branch/i.test(raw)) {

      tex: "I_{LED}=\\frac{V_{R,LED}}{R_{LED}}",
      detail: "per LED branch",
    };
  }

      detail: "",

  }

      tex: "I_{C,max}=\\beta I_{B}",
      detail: "collector load limit",
    };
  }

    return {
      tex: "\\bar V_{load}=D\\cdot V_{S}",
      detail: "PWM duty D, supply VS",
    };
  }
  if (/Thermocouple sensitivity/i.test(raw)) {
    return {
      tex: "\\frac{dV}{dT}=S_{TC}",
      detail: "K-type thermocouple",
    };
  }
  if (/\\Delta\s*V=41/.test(raw)) {
    return {
      tex: "\\Delta V=S_{TC}\\,\\Delta T",
      detail: "thermocouple voltage change",
    };
  }
  if (/T\\in\[-200/.test(raw)) {
    return {
      tex: "T_{min}\\le T\\le T_{max}",
      detail: "K-type usable range",
    };
  }
  if (/P_\{heater\}.*10\^\{2\}.*130/.test(raw)) {
    return {
      tex: "P_{heater}=\\frac{V_{S}^{2}}{R_{heater}}\\,D",
      detail: "PWM heater average dissipation",
    };
  }
  if (/f_\{PWM\}.*490/.test(raw)) {
    return {
      tex: "T_{PWM}\\ll\\tau_{th}\\Rightarrow V_{load}\\to \\bar V_{load}",
      detail: "heater sees average PWM load voltage",
    };
  }
  if (/\\beta=.*2\\,\\text\{mA\}.*200/.test(raw)) {
    return {
      tex: "\\beta=\\frac{I_{C}}{I_{B}}",
      detail: "current gain",
    };
  }
  if (/^\\text\{[^}]+:\s*\}$/.test(raw) || /^\\text\{[^}]+\}$/.test(raw)) {
    return {
      tex: pickFallbackEquation(raw),
      detail: conciseDetail(stripLatex(raw)),
    };
  }
  return null;
}

function normalizeEquationForDisplay(tex = "") {
  tex = String(tex || "").replace(/^\$\$|\$\$$/g, "").replace(/^\$|\$$/g, "").trim();
  if (/\\begin\{[a-z*]+\}/.test(tex)) return { tex, detail: "" };
  const known = normalizeKnownValuedEquation(tex);
  if (known) return known;
  const details = [];
  let cleaned = String(tex || "");
  cleaned = replaceLatexTextCommands(cleaned, (content, index, source) => {
    const plain = normalizeEquationDetail(content);
    const before = source.slice(Math.max(0, index - 4), index);
    const after = source.slice(index + content.length + 7, index + content.length + 12);
    const compact = !/\s/.test(plain) && !/[():;]/.test(plain);
    if (/:/.test(content)) {
      if (plain) details.push(plain);
      return /^[,;:)]/.test(after) ? "" : " ";
    }
    if (before.endsWith("_{") || before.endsWith("_{,") || /[,_{]$/.test(before)) {
      return compact ? `\\mathrm{${plain.replace(/\s+/g, "")}}` : "";
    }
    if (compact && /[A-Za-z]/.test(plain) && !/^(at|per|from|with|and|or)$/i.test(plain)) {
      return `\\mathrm{${plain}}`;
    }
    if (plain) details.push(plain);
    return /^[,;:)]/.test(after) ? "" : " ";
  });
  cleaned = cleaned
    .replace(/\\quad\s*\(([^)]{2,120})\)/g, (_, text) => {
      details.push(normalizeEquationDetail(text));
      return "";
    })
    .replace(/0\.6\s*(?:\\mathrm\{V\})?/g, "V_{D}")
    .replace(/\s*\((\\text\{[^}]+\}|[^)]*\\text\{[^}]+\}[^)]*)\)\s*$/g, "")
    .replace(/\\\s*text\{([^}]*)\}/g, "")
    .replace(/\\\s+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  cleaned = choosePrimaryRelation(cleaned);
  cleaned = stripNumericSubstitutionTail(cleaned);
  if (relationCount(cleaned) > 2) cleaned = truncateExcessRelations(choosePrimaryRelation(cleaned));
  if (/^\s*[A-Za-z ]+\s*$/.test(cleaned) || !/[=<>]|\\(?:le|ge|approx|sim|Rightarrow|propto|in)/.test(cleaned)) {
    const rawPlain = normalizeEquationDetail(stripLatex(tex));
    details.push(rawPlain);
    cleaned = pickFallbackEquation(tex);
  }
  const detail = [...new Set(details.map(conciseDetail).filter(Boolean))][0] || "";
  return { tex: cleaned || pickFallbackEquation(tex), detail };
}

const FALLBACK_EQUATIONS = [
  "y = f(x)",
  "\\frac{dy}{dx} = f(x)",
  "\\int_a^b f(x)\\,dx",
  "\\sum_{k=1}^{n} a_k x^k",
  "f: A \\to B",
  "\\lim_{x \\to 0} \\frac{f(x)}{x}",
  "\\frac{\\partial f}{\\partial x}",
  "A \\Rightarrow B",
];
function pickFallbackEquation(seed = "") {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return FALLBACK_EQUATIONS[h % FALLBACK_EQUATIONS.length];
}

function renderSubscripts(text = "") {
  let html = "";
  let last = 0;
  const rx = /([A-Za-zΔΩΣαβγδεζηθλμνξπρστφψω][A-Za-z0-9]*)_(\(([^)]{1,60})\)|([A-Za-z][A-Za-z0-9]{0,19}|[0-9]{1,6}))/g;
  let m;
  while ((m = rx.exec(text)) !== null) {
    const sub = m[3] !== undefined ? m[3] : m[4];
    html += escapeHtml(text.slice(last, m.index));
    html += `${escapeHtml(m[1])}<sub><i>${escapeHtml(sub)}</i></sub>`;
    last = m.index + m[0].length;
  }
  html += escapeHtml(text.slice(last));
  return html;
}

function looseMathToLatex(text = "") {
  return String(text || "")
    .replace(/≤/g, "\\le ")
    .replace(/≥/g, "\\ge ")
    .replace(/≈/g, "\\approx ")
    .replace(/∝/g, "\\propto ")
    .replace(/→/g, "\\to ")
    .replace(/⇒/g, "\\Rightarrow ")
    .replace(/−/g, "-")
    .replace(/·/g, "\\cdot ")
    .replace(/∫/g, "\\int ")
    .replace(/√\(([^)]+)\)/g, "\\sqrt{$1}")
    .replace(/√([A-Za-z0-9_]+)/g, "\\sqrt{$1}")
    .replace(/∞/g, "\\infty ")
    .replace(/τ/g, "\\tau ")
    .replace(/π/g, "\\pi ")
    .replace(/ω/g, "\\omega ")
    .replace(/Δ/g, "\\Delta ")
    .replace(/λ/g, "\\lambda ")
    .replace(/β/g, "\\beta ")
    .replace(/µ/g, "\\mu ")
    .replace(/\b([A-Za-z])_([A-Za-z0-9]+)\b/g, "$1_{$2}")
    .trim();
}

function shouldRenderLooseMath(candidate = "") {
  const text = String(candidate || "").trim();
  if (text.length < 4 || text.length > 32) return false;
  if (/[a-z]{4,}/.test(text)) return false;
  if (/\b(and|the|with|from|where|showing|resulting|transfer|rules|gain|buffer|frequency|generalisation|transformation)\b/i.test(text)) return false;
  const opIndex = text.search(/=|≈|≤|≥|<|>|∝|→|⇒/);
  if (opIndex < 1 || opIndex > 24) return false;
  const lhs = text.slice(0, opIndex).trim();
  if (/\s[a-z]{3,}\s/i.test(lhs)) return false;
  if (!/[A-ZτΔλπωβ_]/.test(lhs) && !/^[a-z]\([^)]+\)/.test(lhs)) return false;
  const letters = (text.match(/[A-Za-z]/g) || []).length;
  const mathMarks = (text.match(/[=≈≤≥<>∝→⇒_+\-*/^()τΔλπωβµΩ∫√]/g) || []).length;
  return mathMarks >= 2 || letters <= 12;
}

function renderLooseInlineMath(text = "") {
  let html = "";
  let last = 0;
  const rx = /(?:[A-ZτΔλπωβ][A-Za-z0-9_{}(),+\-*/^∞τπµΩ·∫√Δλωβ ]{0,24}|[a-z]\([^)]+\))\s*(?:=|≈|≤|≥|<|>|∝|→|⇒)\s*[^,.;\n]{1,44}/g;
  let match;
  while ((match = rx.exec(text)) !== null) {
    const candidate = match[0].trim();
    if (!shouldRenderLooseMath(candidate)) continue;
    html += renderSubscripts(text.slice(last, match.index));
    html += renderMathFragment(looseMathToLatex(candidate), false);
    last = match.index + match[0].length;
  }
  html += renderSubscripts(text.slice(last));
  return html;
}

function renderRichInline(text = "") {
  let html = "";
  let last = 0;
  const rx = new RegExp(String.raw`\$([^$\n]+?)\$`, "g");
  let match;
  while ((match = rx.exec(text)) !== null) {
    html += renderLooseInlineMath(text.slice(last, match.index));
    html += renderMathFragment(match[1].trim(), false);
    last = match.index + match[0].length;
  }
  html += renderLooseInlineMath(text.slice(last));
  return html;
}

function renderDelimitedInline(text = "") {
  let html = "";
  let last = 0;
  const rx = new RegExp(String.raw`\$([^$\n]+?)\$`, "g");
  let match;
  while ((match = rx.exec(text)) !== null) {
    html += renderSubscripts(text.slice(last, match.index));
    const tex = match[1].trim();
    html += renderMathFragment(tex, false);
    last = match.index + match[0].length;
  }
  html += renderSubscripts(text.slice(last));
  return html;
}

function renderTranscriptText(text = "") {
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  const parts = [];
  let para = [];
  const flushPara = () => {
    if (!para.length) return;
    parts.push(`<p class="transcript-p">${renderDelimitedInline(para.join(" "))}</p>`);
    para = [];
  };
  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) {
      flushPara();
      continue;
    }
    const displayOnly = line.match(/^\$\$([\s\S]+?)\$\$([.,;:]?)$/);
    if (displayOnly) {
      flushPara();
      const rawTex = displayOnly[1].trim();
      const rendered = renderMathFragment(rawTex, true);
      if (rendered) parts.push(`<div class="transcript-math">${rendered}${displayOnly[2] ? `<span class="transcript-punct">${escapeHtml(displayOnly[2])}</span>` : ""}</div>`);
      continue;
    }
    const headingish = !line.includes("$$") && !line.includes("$") && line.length <= 90 && !/[.!?:]$/.test(line) && /^[A-Z0-9][A-Za-z0-9 ,'"()\/-]+$/.test(line);
    if (headingish) {
      flushPara();
      parts.push(`<h4 class="transcript-heading">${escapeHtml(line)}</h4>`);
      continue;
    }
    para.push(line);
  }
  flushPara();
  return `<div class="transcript">${parts.join("")}</div>`;
}

function previewTranscriptText(text = "") {
  return String(text || "").split(/\n\s*Recovered page cues\b/i)[0].trim();
}

function equationBaseLabel(left = "", raw = "") {
  const source = `${left} ${raw}`;
  if (/I_\{LED\}/.test(source)) return "LED Current";
  if (/I_\{C/.test(source)) return "Collector Current";
  if (/I_\{pin\}|I_\{rail\}/.test(source)) return "Arduino Current Limit";
  if (/N_\{LED/.test(source)) return "LED Count Limit";
  if (/\\bar\s*V_\{load\}|V_\{load\}/.test(source)) return "Average Load Voltage";
  if (/P_\{heater\}/.test(source)) return "Heater Power";
  if (/\\Delta\s*V/.test(source)) return "Voltage Change";
  if (/S_\{TC\}|dV.*dT/.test(source)) return "Thermocouple Sensitivity";
  if (/V_\{out\}/.test(source)) return "Output Voltage";
  if (/V_\{in\}/.test(source)) return "Input Voltage";
  if (/V_\{b\}/.test(source)) return "Bias Voltage";
  if (/V_\{BE\}|V_\{BC\}/.test(source)) return "Junction Voltage";
  if (/I_\{d,\s*sat\}|I_\{d,sat\}/.test(source)) return "JFET Saturation Current";
  if (/\\sqrt\{I_\{d/.test(source)) return "Linearized JFET Current";
  if (/Z_\{in\}/.test(source)) return "Input Impedance";
  if (/Z_\{out\}/.test(source)) return "Output Impedance";
  if (/Z_\{eq\}/.test(source)) return "Equivalent Impedance";
  if (/\\omega_\{0\}|f_\{0\}/.test(source)) return "Resonance Frequency";
  if (/T_\{osc\}|T\s*=/.test(source)) return "Oscillation Period";
  if (/CO|e\(t\)|e_\{n\}/.test(source)) return "PID Control";
  if (/\\operatorname\{?(?:AND|NAND|NOT|OR)/.test(source)) return "Logic Rule";
  return "";
}

function equationTitle(tex = "") {
  const display = normalizeEquationForDisplay(tex);
  const raw = String(display.tex || tex || "");
  const plain = stripLatex(raw);
  const left = raw.split("=")[0] || raw;
  const baseLabel = equationBaseLabel(left, raw);
  if (display.detail && baseLabel) return `${baseLabel} (${display.detail})`;
  if (/V\s*=/.test(raw) && /I\s*R/.test(raw)) return "Ohm's Law";
  if (/Z_\{?C/.test(left) || /Z_C/.test(left)) return "Capacitive Impedance";
  if (/Z_\{?L/.test(left) || /Z_L/.test(left)) return "Inductive Impedance";
  if (/Z_\{?R/.test(left) || /Z_R/.test(left)) return "Resistive Impedance";
  if (/\\Gamma|Gamma/i.test(left)) return "Reflection Coefficient";
  if (/\\beta|beta/i.test(left)) return "Current Gain";
  if (/I_\{?C/.test(left)) return "Collector Current";
  if (/I_\{?B/.test(left)) return "Base Current";
  if (/V_\{?th/.test(left)) return "Thevenin Voltage";
  if (/R_\{?th/.test(left)) return "Thevenin Resistance";
  if (/G_\{?LP/.test(left) || /G.*LP/.test(raw)) return "Low-pass Transfer Function";
  if (/G_\{?HP/.test(left) || /G.*HP/.test(raw)) return "High-pass Transfer Function";
  if (/\\omega_\{?0/.test(left) || /omega.*0/.test(raw)) return "Resonance Frequency";
  if (/\\Delta\s*V/.test(left)) return "Voltage Ripple";
  if (/\\lambda|lambda/i.test(left)) return "Wavelength Relation";
  if (/\\omega|omega/i.test(left)) return "Angular Frequency";
  if (/\\theta|theta/i.test(left)) return "Phase Relation";
  if (/\bp\b/.test(left)) return "Power or Momentum";
  if (/\bE\b/.test(left)) return "Energy Relation";
  if (/\bP\b/.test(left)) return "Power Relation";
  if (/\bI\b/.test(left)) return "Current Relation";
  const label = (plain.split("=")[0] || plain || "Equation")
    .replace(/\bDelta\b/gi, "Change in")
    .replace(/\bfrac\b/gi, "")
    .replace(/[^A-Za-z0-9 ]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .split(" ")
    .slice(0, 4)
    .map((word) => word ? word[0].toUpperCase() + word.slice(1).toLowerCase() : "")
    .join(" ");
  const title = baseLabel || `${label || "Equation"} Relation`;
  return display.detail ? `${title} (${display.detail})` : title;
}

function fitPreviewContentOnMobile() {
  const containers = $$(".eq-render, .transcript-math");
  containers.forEach((container) => {
    container.style.removeProperty("min-height");
    const mathBlock = container.querySelector(".katex-display");
    if (!mathBlock) return;
    mathBlock.style.removeProperty("transform");
    mathBlock.style.removeProperty("transform-origin");
    mathBlock.style.removeProperty("width");
    const available = Math.max(1, container.clientWidth - 12);
    const needed = Math.max(1, mathBlock.scrollWidth);
    if (needed <= available) return;
    const scale = Math.min(1, available / needed);
    mathBlock.style.width = `${needed}px`;
    mathBlock.style.transform = `scale(${scale})`;
    mathBlock.style.transformOrigin = "left top";
    container.style.minHeight = `${Math.ceil(mathBlock.scrollHeight * scale) + 4}px`;
  });
}

function updateViewerZoomUI() {
  $("#zoomRange").value = String(state.viewerZoom);
  $("#zoomValue").textContent = `${Math.round(state.viewerZoom * 100)}%`;
}

function applyViewerScale() {
  document.documentElement.style.setProperty("--pdf-fit-scale", String(state.viewerFitScale || 1));
  document.documentElement.style.setProperty("--pdf-zoom", String(state.viewerZoom || 1));
  document.documentElement.style.setProperty("--pdf-total-zoom", String((state.viewerFitScale || 1) * (state.viewerZoom || 1)));
  updateViewerZoomUI();
}

function capturePortalRestoreState() {
  const scroller = getPortalScroller();
  const mobile = document.body.classList.contains("portal-mobile-view");
  state.portalRestore = {
    pageX: mobile ? scroller?.scrollLeft || 0 : window.scrollX || scroller?.scrollLeft || 0,
    pageY: mobile ? scroller?.scrollTop || 0 : window.scrollY || scroller?.scrollTop || 0,
    cardScrolls: $$(".card-body").map((el) => ({
      el,
      top: el.scrollTop,
      left: el.scrollLeft,
    })),
  };
}

function restorePortalState() {
  const restore = state.portalRestore;
  if (!restore) return;
  restore.cardScrolls.forEach(({ el, top, left }) => {
    if (!el?.isConnected) return;
    el.scrollTop = top;
    el.scrollLeft = left;
  });
  const scroller = getPortalScroller();
  const mobile = document.body.classList.contains("portal-mobile-view");
  const restorePage = () => {
    if (scroller?.scrollTo) scroller.scrollTo({ left: restore.pageX, top: restore.pageY, behavior: "auto" });
    else window.scrollTo(restore.pageX, restore.pageY);
    if (!mobile) document.body.scrollTop = restore.pageY;
  };
  restorePage();
  requestAnimationFrame(restorePage);
  state.portalRestore = null;
}

function fitViewerToViewport(preserveCenter = false) {
  if (!state.viewerDoc) return;
  const viewport = $("#viewerViewport");
  const firstCanvas = $(".pdf-page-canvas", viewport);
  if (!viewport || !firstCanvas) return;
  const pageWidth = parseFloat(firstCanvas.dataset.baseWidth || firstCanvas.width || 0);
  const pageHeight = parseFloat(firstCanvas.dataset.baseHeight || firstCanvas.height || 0);
  if (!(pageWidth > 0) || !(pageHeight > 0)) return;
  const prevTotal = Math.max(0.001, (state.viewerFitScale || 1) * (state.viewerZoom || 1));
  const availableWidth = Math.max(120, viewport.clientWidth - 56);
  const availableHeight = Math.max(120, viewport.clientHeight - 56);
  const mobile = document.body.classList.contains("portal-mobile-view");
  const nextFit = Math.max(0.1, mobile ? (availableHeight / pageHeight) : Math.min(availableWidth / pageWidth, availableHeight / pageHeight));
  if (preserveCenter) {
    const centerX = viewport.scrollLeft + viewport.clientWidth / 2;
    const centerY = viewport.scrollTop + viewport.clientHeight / 2;
    const rx = centerX / prevTotal;
    const ry = centerY / prevTotal;
    state.viewerFitScale = nextFit;
    applyViewerScale();
    const nextTotal = Math.max(0.001, nextFit * (state.viewerZoom || 1));
    viewport.scrollLeft = Math.max(0, rx * nextTotal - viewport.clientWidth / 2);
    viewport.scrollTop = Math.max(0, ry * nextTotal - viewport.clientHeight / 2);
    return;
  }
  state.viewerFitScale = nextFit;
  applyViewerScale();
}

async function openViewer(id) {
  const doc = getDoc(id);
  if (!doc) return;
  capturePortalRestoreState();
  state.viewerDoc = doc;
  state.viewerFitScale = 1;
  state.viewerZoom = 1;
  state.renderToken += 1;
  const token = state.renderToken;
  document.body.classList.add("viewer-open");
  $("#viewer").classList.add("open");
  $("#viewer").setAttribute("aria-hidden", "false");
  applyViewerScale();
  $("#viewerTitle").textContent = doc.title;
  $("#viewerSub").textContent = `Loading ${doc.pages} page${doc.pages === 1 ? "" : "s"}...`;
  $("#viewerSave").href = encodeURI(doc.pdf);
  const stage = $("#viewerStage");
  const viewport = $("#viewerViewport");
  stage.innerHTML = "";
  viewport.scrollTop = 0;
  viewport.scrollLeft = 0;
  $(".viewer-body", $("#viewer")).classList.add("viewer-embed-mode");
  const obj = document.createElement("object");
  obj.className = "pdf-embed";
  obj.data = encodeURI(doc.pdf);
  obj.type = "application/pdf";
  obj.innerHTML = `<div class="viewer-error">Your browser cannot display this PDF inline. <a href="${escapeHtml(encodeURI(doc.pdf))}" download style="color:var(--green-bright)">Download it instead</a>.</div>`;
  stage.appendChild(obj);
  $("#viewerSub").textContent = `${doc.pages} page${doc.pages === 1 ? "" : "s"}`;
}

function closeViewer() {
  state.renderToken += 1;
  state.viewerPdf = null;
  state.viewerDoc = null;
  state.viewerFitScale = 1;
  state.drag = null;
  document.body.classList.remove("viewer-open");
  $("#viewer").classList.remove("open");
  $("#viewer").setAttribute("aria-hidden", "true");
  $("#viewerViewport").classList.remove("dragging");
  const vb = $(".viewer-body", $("#viewer"));
  if (vb) vb.classList.remove("viewer-embed-mode");
  restorePortalState();
}

function setZoom(value, preserveCenter = true) {
  const viewport = $("#viewerViewport");
  const prevTotal = Math.max(0.001, (state.viewerFitScale || 1) * (state.viewerZoom || 1));
  const next = Math.max(0.8, Math.min(3, value));
  if (preserveCenter) {
    const centerX = viewport.scrollLeft + viewport.clientWidth / 2;
    const centerY = viewport.scrollTop + viewport.clientHeight / 2;
    const rx = centerX / prevTotal;
    const ry = centerY / prevTotal;
    state.viewerZoom = next;
    applyViewerScale();
    const nextTotal = Math.max(0.001, (state.viewerFitScale || 1) * next);
    viewport.scrollLeft = Math.max(0, rx * nextTotal - viewport.clientWidth / 2);
    viewport.scrollTop = Math.max(0, ry * nextTotal - viewport.clientHeight / 2);
  } else {
    state.viewerZoom = next;
    applyViewerScale();
  }
  startWaveAnim();
}

function updatePageCounter() {
  const viewport = $("#viewerViewport");
  const doc = state.viewerDoc;
  if (!doc) return;
  const frames = $$(".pdf-page-shell", viewport);
  let page = 1;
  const mid = viewport.scrollTop + viewport.clientHeight * 0.38;
  frames.forEach((frame, idx) => {
    if (frame.offsetTop <= mid) page = idx + 1;
  });
  $("#viewerSub").textContent = `${doc.pages} page${doc.pages === 1 ? "" : "s"} | page ${page} of ${doc.pages}`;
}

/* === WAVEFORM ZOOM SLIDER === */
let waveGrabbed = false;
let waveAmplitude = 0;
let waveAnimId = null;
let waveTime = 0;
let waveLastFrame = 0;

function drawZoomWave(now) {
  const canvas = document.getElementById("zoomWaveCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const dt = waveLastFrame ? (now - waveLastFrame) / 1000 : 0.016;
  waveLastFrame = now;

  /* Amplitude ramps up while grabbed, decays when released */
  if (waveGrabbed) {
    waveAmplitude += (1 - waveAmplitude) * 3.5 * dt;
    waveTime += dt;
  } else {
    waveAmplitude *= Math.pow(0.04, dt);  /* fast exponential decay */
    if (waveAmplitude < 0.001) waveAmplitude = 0;
    waveTime += dt * 0.1; /* subtle background oscillation */
  }

  const rangeEl = document.getElementById("zoomRange");
  const min = parseFloat(rangeEl.min);
  const max = parseFloat(rangeEl.max);
  const val = state.viewerZoom;
  const thumbFrac = (val - min) / (max - min);
  const thumbX = 11 + thumbFrac * (W - 22);
  const cy = H / 2;

  /* Build waveform path emanating from the thumb */
  function buildPath() {
    ctx.beginPath();
    for (let x = 0; x <= W; x++) {
      const dx = x - thumbX;
      const spread = W * 0.28;
      const envelope = Math.exp(-(dx * dx) / (2 * spread * spread));
      /* Outward-traveling ripple from thumb + subtle breathing */
      const phase = waveTime * 6.0;
      const ripple = Math.sin((dx / 28) * Math.PI - phase);
      const breath = 1.0 + 0.18 * Math.sin(waveTime * 3.2);
      const wave = ripple * envelope * waveAmplitude * 7.5 * breath;
      const y = cy + wave;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
  }

  /* Three-pass phosphor render: halo → mid → crisp */
  const baseGlow = 0.10 + 0.05 * Math.sin(now * Math.PI * 2 / 5000); // 5 sec breath
  buildPath();
  ctx.strokeStyle = `rgba(80, 255, 150, ${baseGlow.toFixed(3)})`;
  ctx.lineWidth = 7;
  ctx.shadowBlur = 14;
  ctx.shadowColor = "#00ff66";
  ctx.lineJoin = "round";
  ctx.stroke();
  ctx.shadowBlur = 0;

  buildPath();
  ctx.strokeStyle = `rgba(120, 255, 175, ${(0.35 * waveAmplitude).toFixed(3)})`;
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = 6;
  ctx.shadowColor = "#5fff95";
  ctx.stroke();
  ctx.shadowBlur = 0;

  buildPath();
  ctx.strokeStyle = `rgba(223, 255, 235, ${(0.8 * waveAmplitude).toFixed(3)})`;
  ctx.lineWidth = 1;
  ctx.shadowBlur = 3;
  ctx.shadowColor = "#a8ffc8";
  ctx.stroke();
  ctx.shadowBlur = 0;

  waveAnimId = requestAnimationFrame(drawZoomWave);
}

function startWaveAnim() {
  if (!waveAnimId) {
    waveLastFrame = 0;
    waveAnimId = requestAnimationFrame(drawZoomWave);
  }
}

function bindViewer() {
  $("#viewerClose").addEventListener("click", closeViewer);
  $("#viewer").addEventListener("click", (e) => {
    if (e.target.id === "viewer") closeViewer();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("#viewer").classList.contains("open")) closeViewer();
  });
  const rangeEl = $("#zoomRange");
  rangeEl.addEventListener("pointerdown", () => {
    waveGrabbed = true;
    startWaveAnim();
  });
  rangeEl.addEventListener("input", (e) => {
    setZoom(parseFloat(e.target.value));
  });
  const releaseWave = () => {
    waveGrabbed = false;
    /* anim loop continues until amplitude decays to ~0 */
  };
  rangeEl.addEventListener("pointerup", releaseWave);
  rangeEl.addEventListener("pointercancel", releaseWave);
  rangeEl.addEventListener("pointerleave", releaseWave);
  $("#zoomIn").addEventListener("click", () => { waveAmplitude = 0.5; waveGrabbed = false; startWaveAnim(); setZoom(state.viewerZoom + 0.1); });
  $("#zoomOut").addEventListener("click", () => { waveAmplitude = 0.5; waveGrabbed = false; startWaveAnim(); setZoom(state.viewerZoom - 0.1); });
  $("#zoomReset").addEventListener("click", () => { waveAmplitude = 0.3; waveGrabbed = false; startWaveAnim(); setZoom(1); });
  const viewport = $("#viewerViewport");
  viewport.addEventListener("scroll", updatePageCounter, { passive: true });
  viewport.addEventListener("pointerdown", (e) => {
    if (!state.viewerDoc) return;
    if (e.target.closest(".zoom-dock, .viewer-top, a, button, input")) return;
    if (state.viewerZoom <= 1 && e.pointerType !== "touch") return;
    state.drag = { x: e.clientX, y: e.clientY, left: viewport.scrollLeft, top: viewport.scrollTop };
    viewport.classList.add("dragging");
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener("pointermove", (e) => {
    if (!state.drag) return;
    viewport.scrollLeft = state.drag.left - (e.clientX - state.drag.x);
    viewport.scrollTop = state.drag.top - (e.clientY - state.drag.y);
  });
  const endDrag = () => {
    state.drag = null;
    viewport.classList.remove("dragging");
  };
  viewport.addEventListener("pointerup", endDrag);
  viewport.addEventListener("pointercancel", endDrag);
}

/* === PHOSPHOR SCOPE BACKGROUND === */
function animateScope() {
  const canvas = document.getElementById("scopeCanvas");
  const ctx = canvas.getContext("2d");
  const DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));

  let W = 0, H = 0;
  const mouse = { x: -200, y: -200, active: false, jitterUntil: 0 };

  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#020a05";
    ctx.fillRect(0, 0, W, H);
  }
  resize();
  addEventListener("resize", resize);

  addEventListener("pointermove", (e) => {
    mouse.active = true;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.jitterUntil = performance.now() + 380;
  }, { passive: true });

  let triggerCh = 5; // default CH6 (index 5)

  document.addEventListener("click", (e) => {
    // Skip if click is on any interactive/content element
    if (e.target.closest("button,a,input,select,textarea,.doc-card,.preview-block,.card-head,.eq-card,.mobile-hint-card")) return;
    const N = 10;
    const slotH = H / N;
    const clicked = Math.floor(e.clientY / slotH);
    if (clicked >= 0 && clicked < N) {
      triggerCh = clicked;
      mouse.jitterUntil = performance.now() + 600;
    }
  });

  const TWO_PI = Math.PI * 2;

  const channels = [
    {
      name: "CH 1  FG SINE",
      vDiv: "1V/div", vScale: 2.5,
      fn: (xn, t) => Math.sin(TWO_PI * 2.2 * xn - t * 0.55)
    },
    {
      name: "CH 2  RC LP @ fc",
      vDiv: "1V/div", vScale: 2.5,
      fn: (xn, t) => 0.71 * Math.sin(TWO_PI * 2.2 * xn - t * 0.55 - Math.PI / 4)
    },
    {
      name: "CH 3  \u00BD-WAVE RECT",
      vDiv: "2V/div", vScale: 5.0,
      fn: (xn, t) => {
        const s = Math.sin(TWO_PI * 1.6 * xn - t * 0.45);
        return Math.max(s - 0.08, -0.95);
      }
    },
    {
      name: "CH 4  BRIDGE+CAP",
      vDiv: "2V/div", vScale: 5.0,
      fn: (xn, t) => {
        const f = 3.2;
        const phase = ((f * xn - t * 0.45) % 1 + 1) % 1;
        if (phase < 0.12) return 0.85 + 0.10 * (phase / 0.12);
        const d = (phase - 0.12) / 0.88;
        return 0.95 - 0.20 * (1 - Math.exp(-d * 2.2));
      }
    },
    {
      name: "CH 5  DIODE CLIP",
      vDiv: "1V/div", vScale: 2.5,
      fn: (xn, t) => {
        const s = Math.sin(TWO_PI * 1.8 * xn - t * 0.5) * 1.6;
        return Math.max(-0.7, Math.min(0.7, s));
      }
    },
    {
      name: "CH 6  555 ASTABLE",
      vDiv: "2V/div", vScale: 5.0,
      fn: (xn, t) => {
        const f = 1.4, duty = 0.67;
        const phase = ((f * xn - t * 0.5) % 1 + 1) % 1;
        return phase < duty ? 0.85 : -0.85;
      },
      isTrigger: true
    },
    {
      name: "CH 7  \u222B\u2192 TRIANGLE",
      vDiv: "2V/div", vScale: 5.0,
      fn: (xn, t) => {
        const f = 1.6;
        const phase = ((f * xn - t * 0.4) % 1 + 1) % 1;
        return (phase < 0.5 ? 4 * phase - 1 : 3 - 4 * phase) * 0.85;
      }
    },
    {
      name: "CH 8  RELAX OSC",
      vDiv: "1V/div", vScale: 3.3,
      fn: (xn, t) => {
        const f = 1.1;
        const phase = ((f * xn - t * 0.35) % 1 + 1) % 1;
        const k = 5.5;
        if (phase < 0.5) return -0.65 + 1.30 * (1 - Math.exp(-phase * k * 2));
        return 0.65 - 1.30 * (1 - Math.exp(-(phase - 0.5) * k * 2));
      }
    },
    {
      name: "CH 9  COAX ECHO",
      vDiv: "1V/div", vScale: 3.0,
      fn: (xn, t) => {
        const period = 2.4;
        const tt = ((t * 0.50) % period + period) % period;
        const A = 0.88, w = 0.026;
        const xOff = -0.05, xFar = 1.05;  // spawn off-screen to avoid pop
        const tHit  = period * 0.40;       // outgoing exits screen
        const tMeet = period * 0.60;       // pulses meet at x=0.50; sum=0 → cut to flat
        const spd = (xFar - xOff) / tHit;
        function gauss(center) {
          const d = (xn - center) / w;
          return A * Math.exp(-d * d * 2.5);
        }
        if (tt < tHit)  return gauss(xOff + spd * tt);
        if (tt < tMeet) {
          const dt = tt - tHit;
          return gauss(xOff + spd * dt) - gauss(xFar - spd * dt);
        }
        return 0;
      }
    },
    {
      name: "CH10  PWM 490Hz",
      vDiv: "2V/div", vScale: 5.0,
      fn: (xn, t) => {
        const f = 1.8;
        const duty = 0.5 + 0.42 * Math.sin(t * 0.18);
        const phase = ((f * xn - t * 0.6) % 1 + 1) % 1;
        return phase < duty ? 0.82 : -0.82;
      }
    }
  ];

  // Per-channel phosphor brightness (simulated aging)
  const chBright = channels.map((_, i) => 0.84 + Math.random() * 0.16);
  chBright[0] = 1.0; chBright[5] = 0.98;

  function drawGraticule() {
    ctx.save();
    ctx.lineWidth = 1;
    // Major 10x10 grid
    ctx.strokeStyle = "rgba(48,200,110,.10)";
    ctx.beginPath();
    for (let i = 1; i < 10; i++) {
      const y = (H / 10) * i;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    for (let i = 1; i < 10; i++) {
      const x = (W / 10) * i;
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    ctx.stroke();

    // Center crosshair sub-ticks
    ctx.strokeStyle = "rgba(80,220,130,.22)";
    ctx.beginPath();
    const cx = W / 2, cy = H / 2;
    for (let i = 1; i < 50; i++) {
      const tx = (W / 50) * i;
      ctx.moveTo(tx, cy - 3); ctx.lineTo(tx, cy + 3);
    }
    for (let i = 1; i < 50; i++) {
      const ty = (H / 50) * i;
      ctx.moveTo(cx - 3, ty); ctx.lineTo(cx + 3, ty);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawScanlines() {
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,.14)";
    for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
    ctx.restore();
  }

  function drawVignette() {
    ctx.save();
    const grad = ctx.createRadialGradient(
      W / 2, H / 2, Math.min(W, H) * 0.28,
      W / 2, H / 2, Math.max(W, H) * 0.74
    );
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(0.55, "rgba(0,0,0,.06)");
    grad.addColorStop(1, "rgba(0,8,4,.58)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawReticle() {
    if (!mouse.active) return;
    ctx.save();
    ctx.strokeStyle = "rgba(140,255,195,.32)";
    ctx.lineWidth = 0.6;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(mouse.x, 0); ctx.lineTo(mouse.x, H);
    ctx.moveTo(0, mouse.y); ctx.lineTo(W, mouse.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(180,255,210,.55)";
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 2.4, 0, TWO_PI);
    ctx.fill();
    ctx.restore();
  }

  // DOM status bar — reactive to cursor
  const statusLeft = document.querySelector("#scopeStatus .scope-left");
  const statusRight = document.querySelector("#scopeStatus .scope-right");
  let lastStatusTick = 0;

  function updateStatus(now) {
    if (now - lastStatusTick < 200) return;
    lastStatusTick = now;

    const N = channels.length;
    const slotH = H / N;
    const labelGap = Math.max(8, Math.min(10, slotH * 0.16)) + 3;
    const ampH = (slotH - labelGap * 2) * 0.48;

    const trigName = channels[triggerCh]?.name.split(/\s{2,}/)[0] || "CH6";
    let left = `1 ms/div   AC   TRIG \u25B8 ${trigName} \u2197   1M\u03A9 \u2016 16 pF`;

    if (mouse.active && mouse.x > 0 && mouse.y > 0) {
      let nearCh = 0, nearDist = Infinity;
      for (let i = 0; i < N; i++) {
        const cy = slotH * (i + 0.5);
        const d = Math.abs(mouse.y - cy);
        if (d < nearDist) { nearDist = d; nearCh = i; }
      }
      const ch = channels[nearCh];
      const tMs = ((mouse.x / W) * 10).toFixed(1);
      const voltNorm = -((mouse.y - slotH * (nearCh + 0.5)) / ampH);
      const v = (voltNorm * (ch.vScale || 1)).toFixed(2);
      left = `\u25C6 ${ch.name}   ${ch.vDiv}   t=${tMs} ms   V=${v} V`;
    }

    statusLeft.textContent = left;
    statusRight.textContent = "PHYS\u00B70525   CRT\u00B7SIM  v2.0";
  }

  // Mains-noise flicker with 60 Hz component
  function flicker(now) {
    const mains60 = Math.sin(now * 0.37699) * 0.008;
    return 0.02 + 0.02 * Math.sin(now * 0.012) * Math.sin(now * 0.0017) + mains60;
  }

  function tick(now) {
    const t = now / 1000;

    // Persistence fade with warm-green tint
    ctx.save();
    const fadeAlpha = 0.13 + flicker(now);
    ctx.fillStyle = `rgba(3,12,7,${fadeAlpha.toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    drawGraticule();

    // Trigger jitter on pointer motion
    const jitter = mouse.jitterUntil > now ? Math.sin(now * 0.04) * 3.2 : 0;

    // Layout — 10 channels map 1:1 to the 10-row graticule
    const N = channels.length;
    const slotH = H / N;
    const fontSize = Math.max(8, Math.min(10, slotH * 0.16));
    const labelGap = fontSize + 3;          // label just below top graticule line
    const ampHalf = (slotH - labelGap * 2) * 0.48; // waveform fits between label zones
    const samples = Math.min(W < 640 ? 320 : 720, Math.floor(W / 1.6));
    const labelFont = `${fontSize}px ui-monospace,'SF Mono',Menlo,monospace`;

    for (let i = 0; i < N; i++) {
      const ch = channels[i];
      const slotTop = slotH * i;             // graticule line above
      const slotBot = slotH * (i + 1);       // graticule line below
      const cy = slotH * (i + 0.5);          // exact center between lines
      const b = chBright[i];
      const isDigital = ch.isTrigger || ch.name.includes("PWM") || ch.name.includes("CLIP");

      ctx.save();
      ctx.font = labelFont;
      ctx.textBaseline = "top";

      // === Channel label — consistent gap below line above ===
      ctx.textAlign = "left";
      ctx.fillStyle = `rgba(110,240,160,${(0.48 + b * 0.14).toFixed(2)})`;
      ctx.fillText(ch.name, 12, slotTop + 3);

      // Trigger marker
      if (i === triggerCh) {
        ctx.fillStyle = "rgba(180,255,200,.85)";
        ctx.fillText("  \u25B8T", 12 + ctx.measureText(ch.name).width, slotTop + 3);
      }

      // === V/div — consistent gap above line below ===
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillStyle = "rgba(110,240,160,.22)";
      const rightX = W - 14;
      ctx.fillText(ch.vDiv, rightX, slotBot - 3);

      // === 0V — centered between horizontal lines ===
      ctx.textBaseline = "middle";
      ctx.strokeStyle = "rgba(110,240,160,.20)";
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(rightX + 2, cy); ctx.lineTo(rightX + 7, cy);
      ctx.stroke();
      ctx.fillStyle = "rgba(110,240,160,.30)";
      ctx.fillText("0V", rightX, cy);
      ctx.restore();

      // === Build trace path ===
      const path = new Path2D();
      for (let j = 0; j <= samples; j++) {
        const xn = j / samples;
        const x = xn * W + jitter;
        let y = ch.fn(xn, t) * ampHalf;
        y += Math.sin(t * 53 + i * 1.7 + xn * 4) * 0.20;
        const yy = cy + y;
        if (j === 0) path.moveTo(x, yy);
        else path.lineTo(x, yy);
      }

      // === Beam retrace for digital channels ===
      if (isDigital) {
        ctx.save();
        ctx.strokeStyle = "rgba(60,200,100,.03)";
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(0, cy); ctx.lineTo(W, cy);
        ctx.stroke();
        ctx.restore();
      }

      // === Three-pass phosphor with per-channel brightness ===

      // 1) Outer halo
      ctx.save();
      ctx.strokeStyle = `rgba(80,255,150,${(0.16 * b).toFixed(3)})`;
      ctx.lineWidth = isDigital ? 10 : 8;
      ctx.shadowBlur = (isDigital ? 24 : 18) * b;
      ctx.shadowColor = "#30ff70";
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.stroke(path);
      ctx.restore();

      // 2) Mid trace
      ctx.save();
      ctx.strokeStyle = `rgba(120,255,175,${(0.60 * b).toFixed(3)})`;
      ctx.lineWidth = 2.4;
      ctx.shadowBlur = 8 * b;
      ctx.shadowColor = "#65ffa0";
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.stroke(path);
      ctx.restore();

      // 3) Bright phosphor center
      ctx.save();
      const cR = Math.round(223 * b + 32);
      const cG = Math.round(255 * b);
      const cB = Math.round(235 * b + 20);
      ctx.strokeStyle = `rgb(${cR},${cG},${cB})`;
      ctx.lineWidth = 1.0;
      ctx.shadowBlur = 4 * b;
      ctx.shadowColor = "#b0ffd0";
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.stroke(path);
      ctx.restore();
    }

    drawReticle();
    drawScanlines();
    drawVignette();
    updateStatus(now);

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
}

function syncTopbarOffset() {
  const topbar = document.querySelector(".portal-topbar");
  const height = Math.ceil(topbar?.offsetHeight || 0);
  document.documentElement.style.setProperty("--topbar-space", `${Math.max(72, height + 8)}px`);
}

function runSearch() {
  const query = document.getElementById("query");
  markLandingTouched();
  state.query = query.value;
  ensureSelection();
  renderAll();
}

document.getElementById("query").addEventListener("input", (e) => {
  markLandingTouched();
  state.query = e.target.value;
  ensureSelection();
  renderAll();
});
document.getElementById("query").addEventListener("focus", markLandingTouched);
document.getElementById("query").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  runSearch();
});
document.getElementById("searchSubmit").addEventListener("click", runSearch);
document.getElementById("searchClear").addEventListener("click", () => {
  const query = document.getElementById("query");
  markLandingTouched();
  query.value = "";
  state.query = "";
  state.mobileSections.notes = false;
  state.mobileSections.assignments = false;
  state.mobileSections.labs = false;
  ensureSelection();
  renderAll();
  query.focus();
});
document.getElementById("mobilePreviewClose").addEventListener("click", () => {
  markLandingTouched();
  state.mobilePreviewOpen = false;
  syncMobilePreviewState();
  syncMobileHintState();
});
$$(".mobile-section-toggle").forEach((button) => {
  button.addEventListener("click", () => {
    const section = button.dataset.section;
    if (!section) return;
    markLandingTouched();
    if (document.body.classList.contains("portal-mobile-view")) {
      state.mobilePreviewOpen = false;
      syncMobilePreviewState();
    }
    state.mobileSections[section] = !state.mobileSections[section];
    syncMobileSectionState();
  });
});

bindViewer();
animateScope();
startWaveAnim();
syncResponsiveMode();
syncTopbarOffset();
window.addEventListener("resize", () => {
  syncResponsiveMode();
  syncTopbarOffset();
  fitPreviewContentOnMobile();
  if (state.viewerDoc) fitViewerToViewport(true);
});
function handlePortalScroll() {
  const scroller = getPortalScroller();
  const scrollY = document.body.classList.contains("portal-mobile-view") ? scroller?.scrollTop || 0 : window.scrollY;
  if (document.body.classList.contains("portal-mobile-view") && scrollY > 4) markLandingTouched();
}
window.addEventListener("scroll", handlePortalScroll, { passive: true });
document.querySelector(".app")?.addEventListener("scroll", handlePortalScroll, { passive: true });
document.querySelector(".content-shell")?.addEventListener("touchstart", markLandingTouched, { passive: true });
renderAll();
