<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- jump trajectory: launch low-left, arc over, land low-right -->
  <path d="M3.6 17.6 C 6 7, 13 4.6, 18.4 13.4" />
  <!-- arrowhead at the landing point, opening toward the descent -->
  <path d="M18.7 13.9 L18 9.1" />
  <path d="M18.7 13.9 L13.9 14.7" />
  <!-- launch marker -->
  <circle cx="3.6" cy="17.6" r="1.5" fill="#000000" stroke="none" />
</svg>
