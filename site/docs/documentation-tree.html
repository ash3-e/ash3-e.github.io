<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Documentation</title>
  <link rel="stylesheet" href="../assets/tree-styles.css?v=tree-search-find-arrow-20260601" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
  <link rel="stylesheet" href="../assets/hljs-theme.css">
</head>

<body data-page-type="hub" data-agent="tree">
  <header>
    <div class="header-content">
      <a class="brand" href="../index.html" aria-label="Home">
        <img src="../assets/logo.png" alt="BCODe">
        <span class="tag">Documentation</span>
      </a>
      <a class="fixed-doc-btn" href="../docs/documentation-tree.html" aria-label="Documentation">
        <img src="../assets/documentation.svg" alt="">
        <span>Documentation</span>
      </a>
    </div>
  </header>
  <main>
    <div class="container">
      <div class="stack">
        <section class="card tree-hero-card tree-control-card mode-switcher-host">
          <div class="tree-node-header tree-control-head">
            <h1 class="tree-node-title tree-control-title">
              <span class="tree-node-title-label">Documentation Tree Map</span>
            </h1>
            <div class="mode-switcher-wrap tree-mode-switcher-wrap">
              <button type="button" class="mode-switcher" id="treeThemeToggle" aria-expanded="false" aria-label="Theme switcher">
                <img class="mode-switcher-icon" id="treeThemeIcon" alt="">
                <span class="mode-caret">&#9662;</span>
              </button>
              <button type="button" class="mode-switcher lava-toggle" id="treeLavaToggle" aria-pressed="true" aria-label="Toggle lava lamp background">
                <img class="mode-switcher-icon lava-toggle-icon" src="../assets/lava.svg" alt="Lava lamp">
              </button>
              <div class="mode-switcher-menu" id="treeThemeMenu">
                <div class="mode-switcher-row">
                  <button type="button" class="mode-switcher-item" data-mode="light">
                    <img class="mode-switcher-item-icon" src="../assets/sun.svg" alt="">
                    <span class="mode-switcher-item-label">Light</span>
                    <span class="mode-switcher-check">&#10003;</span>
                  </button>
                  <button type="button" class="mode-switcher-item" data-mode="balanced">
                    <img class="mode-switcher-item-icon" src="../assets/half.svg" alt="">
                    <span class="mode-switcher-item-label">Balanced</span>
                    <span class="mode-switcher-check">&#10003;</span>
                  </button>
                  <button type="button" class="mode-switcher-item" data-mode="dark">
                    <img class="mode-switcher-item-icon" src="../assets/moon.svg" alt="">
                    <span class="mode-switcher-item-label">Dark</span>
                    <span class="mode-switcher-check">&#10003;</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="tree-control-body">
          <div class="search-row hub-top-search">
            <div class="hub-search-input-wrap reader-search-input-wrap">
              <img class="reader-search-input-icon" src="../assets/magnify.svg" alt="">
              <span class="reader-search-input-loader" role="status" aria-label="Searching" aria-hidden="true"></span>
              <input id="docSearch" class="dock-input" type="search" placeholder="Search documentation..."
                aria-label="Search documentation">
              <button type="button" id="treeSearchClear" class="tree-search-clear" aria-label="Clear search">&times;</button>
              <button type="button" id="treeSearchFind" class="tree-search-find" aria-label="Search documentation" title="Search">&#8594;</button>
            </div>
          </div>
          <div class="tree-search-help" aria-hidden="true">
            <div class="tree-sitemap-legend">
              <span class="tree-legend-pill">Click Selects Preview</span>
              <span class="tree-legend-pill">Double Click Jumps</span>
              <span class="tree-legend-pill">Contextual Search Preview</span>
              <span class="tree-legend-pill">Scroll Tree Nodes</span>
            </div>
          </div>
          <span class="tree-search-meta" id="treeSearchMeta" aria-live="polite">Search within Documentation</span>
          </div>
        </section>

        <section class="card tree-sitemap-card">
          <div class="tree-sitemap-shell" id="treeSitemapShell">
            <div class="tree-sitemap-stage" id="treeSitemapStage">
              <svg class="tree-sitemap-connectors" id="treeSitemapConnectors" aria-hidden="true"></svg>
              <div class="tree-sitemap-tree" id="treeSitemapTree"></div>
              <svg class="tree-sitemap-connectors tree-sitemap-connectors-overlay" id="treeSitemapConnectorsOverlay" aria-hidden="true"></svg>
            </div>
          </div>
          <section class="card tree-gallery-card" id="treeGalleryCard" tabindex="0">
            <div class="tree-gallery-eyebrow">Example Gallery</div>
            <div class="tree-gallery-head">
              <h2 class="tree-gallery-title">Example Gallery</h2>
              <span class="tree-gallery-badge">intro subtree</span>
            </div>
            <div class="tree-gallery-body">
              <div class="tree-example-gallery-list" id="treeExampleGalleryList"></div>
            </div>
          </section>
          <section class="card tree-preview-card" id="treePreviewCard" tabindex="0" aria-live="polite">
            <div class="tree-preview-eyebrow">Documentation Preview</div>
            <div class="tree-preview-head">
              <div>
                <h2 id="treePreviewTitle">Intro</h2>
                <p id="treePreviewMeta">bcode-intro-v2</p>
              </div>
              <div class="tree-preview-head-actions">
                <button type="button" class="tree-preview-action" id="treePreviewOpen">Open &rarr;</button>
                <button type="button" class="mobile-panel-close tree-preview-mobile-close" id="treePreviewMobileClose" aria-label="Close preview">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="tree-preview-body" id="treePreviewBody">
              <p id="treePreviewSummary"></p>
              <div class="tree-preview-snippet" id="treePreviewSnippet"></div>
              <div class="tree-preview-subrows" id="treePreviewSubrows"></div>
            </div>
          </section>
        </section>
      </div>
    </div>
  </main>
  <script src="../assets/tree-docs-data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="../assets/bcode_lang.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../assets/tree-site.js?v=tree-search-find-arrow-20260601"></script>
  <script src="../assets/lavalamp.js"></script>
</body>

</html>
