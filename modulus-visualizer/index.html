<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modulus visualizer — WebGL fast renderer</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #0a0418; color: rgba(218,227,246,.78); font: 12px/1.5 "Spline Sans Mono", ui-monospace, "Cascadia Mono", monospace; overflow: hidden; }
  #host, .visualizer-stage { position: fixed; inset: 0; }
  .visualizer-stage--gl canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hud { position: fixed; right: 14px; bottom: 14px; z-index: 5; display: flex; gap: 6px; align-items: center;
    padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(198,168,255,.28); background: rgba(14,8,32,.82); }
  .hud button { min-width: 34px; padding: 6px 8px; font: inherit; color: rgba(218,227,246,.78);
    background: rgba(255,255,255,.02); border: 1px solid rgba(198,168,255,.14); border-radius: 4px; cursor: pointer; }
  .hud button[aria-pressed="true"] { color: #120a20; background: #c6a8ff; border-color: #c6a8ff; font-weight: 600; }
  .hud b { color: #7fe3d4; min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="host"></div>
<div class="hud">
  <button data-p="A" aria-pressed="true">A</button><button data-p="B">B</button><button data-p="C">C</button><button data-p="D">D</button><button data-p="E">E</button>
  <b id="fps">—</b>
</div>
<script>
const PATTERNS = {
    t1: { kind: 'linear', angle: 90 },
    t2: { kind: 'radial', angle: 0 },
    t3: { kind: 'linear', angle: 0 },
    t3a: { kind: 'linear', angle: 0 },
    t4: { kind: 'linear', angle: 90 },
    t5: { kind: 'radial', angle: 0 },
    t6: { kind: 'band', angle: 0 },
    t7: { kind: 'linear', angle: 135 },
    t8: { kind: 'ring', angle: 0 },
};
const SURFACES = {
    main: [8, 4, 20, .54],
    elevated: [14, 8, 32, .82],
    chrome: [10, 6, 24, .58],
    code: [4, 2, 12, .8],
    input: [6, 2, 16, .68],
    overlay: [7, 3, 18, .8],
};
const KIND_ID = { linear: 0, radial: 1, ring: 2, band: 3 };
const ANIM_ID = { flow: 0, burst: 1, 'burst-b': 2 };
const BLEND_ID = { normal: 0, screen: 1, overlay: 2, 'soft-light': 3, multiply: 4 };
const MAX_CHAMBERS = 4;
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
const VECTORS = [];
for (let q = -3; q <= 3; q += 1) {
    for (let r = -3; r <= 3; r += 1) {
        if ((q || r) && gcd(Math.abs(q), Math.abs(r)) === 1)
            VECTORS.push([q, r]);
    }
}
function numeric(source, key, fallback = 0) {
    const value = source[key];
    return typeof value === 'number' && Number.isFinite(value) ? value : fallback;
}
function textual(source, key, fallback = '') {
    const value = source[key];
    return typeof value === 'string' ? value : fallback;
}
function logical(source, key, fallback = false) {
    const value = source[key];
    return typeof value === 'boolean' ? value : fallback;
}
function toDotState(source) {
    return {
        preset: textual(source, 'preset', 't3'),
        cell: numeric(source, 'cell', 6),
        hard: numeric(source, 'hard', 22),
        dense: numeric(source, 'dense', 40),
        sparse: numeric(source, 'sparse', 88),
        reach: numeric(source, 'reach', 100),
        speed: numeric(source, 'speed', 42),
        run: numeric(source, 'run', 22),
        jit: numeric(source, 'jit', 58),
        dir: numeric(source, 'dir', 0),
        flip: logical(source, 'flip'),
        emit: textual(source, 'emit', 'single'),
        vanish: numeric(source, 'vanish', 100),
        vwidth: numeric(source, 'vwidth', 100),
        vstrength: numeric(source, 'vstrength', 10),
        ox: numeric(source, 'ox', 50),
        oy: numeric(source, 'oy', 50),
    };
}
function snapVector(x, y) {
    let best = VECTORS[0];
    let bestDot = -2;
    for (const vector of VECTORS) {
        const dot = (vector[0] * x + vector[1] * y) / Math.hypot(vector[0], vector[1]);
        if (dot > bestDot) {
            bestDot = dot;
            best = vector;
        }
    }
    return best;
}
function heading(state, angle) {
    const radians = (angle + (state.flip ? 180 : 0)) * Math.PI / 180;
    return snapVector(Math.sin(radians), -Math.cos(radians));
}
function vanishRange(state) {
    const base = Math.max(8, Math.min(100, state.reach));
    const span = base * Math.max(4, Math.min(100, state.vwidth)) / 100;
    const opaque = Math.max(0, Math.min(100, state.vanish)) / 100 * span;
    const soft = Math.min(span, opaque + Math.max(0.5, span * (state.vstrength / 100)));
    return [opaque / 100, soft / 100];
}
function buildChambers(state, renderScale) {
    const pattern = PATTERNS[state.preset] ?? PATTERNS.t3;
    const radial = pattern.kind === 'radial' || pattern.kind === 'ring';
    const [vanOpaque, vanSoft] = vanishRange(state);
    const make = (kind, angle, half, invert, vector, animation) => {
        const sourceCell = state.cell;
        const sourceTile = Math.max(sourceCell, state.run * sourceCell);
        const cell = sourceCell * renderScale;
        const tile = sourceTile * renderScale;
        const duration = animation === 'flow'
            ? Math.max(0.05, Math.hypot(vector[0], vector[1]) * sourceTile / Math.max(1, state.speed))
            : 260 / Math.max(1, state.speed);
        return {
            kind: KIND_ID[kind],
            anim: ANIM_ID[animation],
            angle: (angle + (kind !== 'radial' && kind !== 'ring' && state.flip ? 180 : 0)) * Math.PI / 180,
            half: half ? 1 : 0,
            invert: invert ? 1 : 0,
            origin: [state.ox / 100, state.oy / 100],
            reach: Math.max(8, Math.min(100, state.reach)) / 100,
            dense: state.dense / 100,
            sparse: state.sparse / 100,
            vanish: [vanOpaque, vanSoft],
            cell,
            tile,
            flow: [vector[0] * tile, vector[1] * tile],
            duration,
            rampOpacity: 0.3 + state.hard / 200,
            noiseSlope: (state.jit / 100) * 1.7,
        };
    };
    if (state.emit === 'edges' || state.emit === 'corners') {
        return [0, 90, 180, 270].map((angle) => (make('linear', angle, true, false, heading(state, angle), 'flow')));
    }
    if (radial) {
        const plan = [make(pattern.kind, pattern.angle, false, false, [0, 0], 'burst')];
        if (state.emit !== 'single')
            plan.push(make(pattern.kind, pattern.angle, false, true, [0, 0], 'burst-b'));
        return plan;
    }
    const mirrored = state.emit === 'mirror';
    const plan = [make(pattern.kind, pattern.angle, mirrored, false, heading(state, state.dir), 'flow')];
    if (state.emit !== 'single') {
        plan.push(make(pattern.kind, pattern.angle + 180, mirrored, false, heading(state, state.dir + 180), 'flow'));
    }
    return plan;
}
function hexToRgb(value) {
    const hex = /^#[0-9a-f]{6}$/i.test(value) ? value : '#7fe3d4';
    return [
        parseInt(hex.slice(1, 3), 16) / 255,
        parseInt(hex.slice(3, 5), 16) / 255,
        parseInt(hex.slice(5, 7), 16) / 255,
    ];
}
const VERTEX_SHADER = `#version 300 es
void main() {
  vec2 pos = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);
  gl_Position = vec4(pos, 0.0, 1.0);
}`;
const FRAGMENT_SHADER = `#version 300 es
precision highp float;
out vec4 outColor;

uniform vec2 uScene;        // scene size in css px
uniform float uScale;       // canvas px per scene px
uniform float uTime;
uniform sampler2D uNoiseTex;

uniform vec3 uInkTint;
uniform vec4 uSurface;      // specimen surface rgba
uniform int uInkBlend;
uniform int uNormalBlend;
uniform float uNormalMix;
uniform vec2 uInkEdge;      // edge fade fractions
uniform vec2 uNormalEdge;
uniform int uNormalEncoding; // 0 height, 1 tangent
uniform int uNormalRemap;    // 0 gl, 1 fx, 2 dx, 3 swap

#define MAXC ${MAX_CHAMBERS}
uniform int uCount[2];
uniform int uKind[MAXC * 2];
uniform int uAnim[MAXC * 2];
uniform float uAngle[MAXC * 2];
uniform int uHalf[MAXC * 2];
uniform int uInvert[MAXC * 2];
uniform vec2 uOrigin[MAXC * 2];
uniform float uReach[MAXC * 2];
uniform vec2 uDS[MAXC * 2];
uniform vec2 uVanish[MAXC * 2];
uniform float uCell[MAXC * 2];
uniform float uTile[MAXC * 2];
uniform vec2 uFlow[MAXC * 2];
uniform float uDur[MAXC * 2];
uniform float uRampOp[MAXC * 2];
uniform float uNoiseSlope[MAXC * 2];

// ── blend helpers (W3C compositing) ─────────────────────────────
float softLightC(float b, float s) {
  if (s <= 0.5) return b - (1.0 - 2.0 * s) * b * (1.0 - b);
  float d = (b <= 0.25) ? ((16.0 * b - 12.0) * b + 4.0) * b : sqrt(b);
  return b + (2.0 * s - 1.0) * (d - b);
}
vec3 softLight(vec3 b, vec3 s) {
  return vec3(softLightC(b.r, s.r), softLightC(b.g, s.g), softLightC(b.b, s.b));
}
float overlayC(float b, float s) {
  return b <= 0.5 ? 2.0 * b * s : 1.0 - 2.0 * (1.0 - b) * (1.0 - s);
}
vec3 blendMode(int mode, vec3 b, vec3 s) {
  if (mode == 1) return 1.0 - (1.0 - b) * (1.0 - s);
  if (mode == 2) return vec3(overlayC(b.r, s.r), overlayC(b.g, s.g), overlayC(b.b, s.b));
  if (mode == 3) return softLight(b, s);
  if (mode == 4) return b * s;
  return s;
}

// ── ramp: signed density along the pattern axis ────────────────
// Returns vec2(color, alpha): color 0 = black (dense end), 1 = white (sparse).
// Stop layouts transcribed from buildRamp() in the DOM port.
vec2 rampStops(float t, float reach, float dense, float sparse, int kind, bool half_, bool invert) {
  float R = reach;
  if (kind == 1) { // radial
    if (invert) {
      if (t < 0.44) return vec2(1.0, sparse);
      if (t < 0.58) return vec2(1.0, sparse * (1.0 - (t - 0.44) / 0.14));
      if (t < 0.66) return vec2(0.0, 0.0);
      return vec2(0.0, dense * clamp((t - 0.66) / 0.34, 0.0, 1.0));
    }
    if (t < 0.34 * R) return vec2(0.0, dense * (1.0 - t / (0.34 * R)));
    if (t < 0.44 * R) return vec2(0.0, 0.0);
    return vec2(1.0, sparse * clamp((t - 0.44 * R) / (0.52 * R), 0.0, 1.0));
  }
  if (kind == 2) { // ring
    if (t < 0.20) return vec2(1.0, sparse * (1.0 - t / 0.20));
    if (t < 0.28) return vec2(0.0, 0.0);
    if (t < 0.46 * R) return vec2(0.0, dense * clamp((t - 0.28) / (0.46 * R - 0.28), 0.0, 1.0));
    if (t < 0.64 * R) return vec2(0.0, dense * (1.0 - (t - 0.46 * R) / (0.18 * R)));
    if (t < 0.72 * R) return vec2(1.0, 0.0);
    return vec2(1.0, sparse * clamp((t - 0.72 * R) / (1.0 - 0.72 * R), 0.0, 1.0));
  }
  if (kind == 3) { // band
    if (t < 0.26) return vec2(1.0, sparse * (1.0 - t / 0.26));
    if (t < 0.36) return vec2(0.0, 0.0);
    if (half_) return vec2(0.0, dense * clamp((t - 0.36) / 0.14, 0.0, 1.0));
    if (t < 0.50) return vec2(0.0, dense * (t - 0.36) / 0.14);
    if (t < 0.64) return vec2(0.0, dense * (1.0 - (t - 0.50) / 0.14));
    if (t < 0.74) return vec2(1.0, 0.0);
    return vec2(1.0, sparse * clamp((t - 0.74) / 0.26, 0.0, 1.0));
  }
  // linear
  if (half_) {
    if (t < 0.46 * R) return vec2(0.0, dense * (1.0 - t / (0.46 * R)));
    if (t < 0.58 * R) return vec2(0.0, 0.0);
    return vec2(1.0, sparse * clamp((t - 0.58 * R) / (0.42 * R), 0.0, 1.0));
  }
  if (t < 0.48) return vec2(0.0, dense * (1.0 - t / 0.48));
  if (t < 0.52) return vec2(0.0, 0.0);
  return vec2(1.0, sparse * clamp((t - 0.52) / 0.48, 0.0, 1.0));
}

// Gradient-line coordinate for a CSS gradient at 'angle' across the unit box.
float gradientT(vec2 u, float angle) {
  vec2 dir = vec2(sin(angle), -cos(angle));
  float len = abs(dir.x) + abs(dir.y); // projection span of unit box
  float t = dot(u - 0.5, dir) / max(len, 1e-4) + 0.5;
  return clamp(t, 0.0, 1.0);
}

float farthestCorner(vec2 origin, vec2 aspect) {
  vec2 c = max(origin, 1.0 - origin) * aspect;
  return length(c);
}
float farthestSide(vec2 origin, vec2 aspect) {
  vec2 c = max(origin, 1.0 - origin) * aspect;
  return max(c.x, c.y);
}

float patternT(vec2 u, int kind, float angle, vec2 origin, vec2 aspect) {
  if (kind == 1) { // radial farthest-corner
    return length((u - origin) * aspect) / max(farthestCorner(origin, aspect), 1e-4);
  }
  if (kind == 2) { // ring farthest-side
    return length((u - origin) * aspect) / max(farthestSide(origin, aspect), 1e-4);
  }
  return gradientT(u, angle);
}

float vanishMask(vec2 u, int kind, float angle, vec2 origin, vec2 aspect, vec2 van, bool invert) {
  float t;
  if (kind == 1 || kind == 2) {
    t = length((u - origin) * aspect) / max(farthestCorner(origin, aspect), 1e-4);
    if (invert) return smoothstep(1.0 - van.y, 1.0 - van.x, t);
  } else {
    t = gradientT(u, angle);
  }
  return 1.0 - smoothstep(van.x, van.y, t);
}

// ── sprites ─────────────────────────────────────────────────────
// Ink relief disc, transcribed from the DOM port's SVG sprite.
vec4 inkSprite(vec2 c) {
  float dc = distance(c, vec2(0.5));
  float disc = 1.0 - smoothstep(0.462, 0.475, dc);
  if (disc <= 0.0) return vec4(0.0);
  float t = distance(c, vec2(0.34, 0.29)) / 0.68;
  vec3 col;
  float a = 1.0;
  vec3 tint = uInkTint;
  vec3 deep = vec3(0.086, 0.016, 0.149); // #160426
  vec3 core = vec3(0.008, 0.004, 0.024); // #020106
  if (t < 0.10) col = vec3(1.0);
  else if (t < 0.28) col = mix(vec3(1.0), tint, (t - 0.10) / 0.18);
  else if (t < 0.58) col = tint;
  else if (t < 0.76) col = mix(tint, deep, (t - 0.58) / 0.18);
  else if (t < 0.90) col = mix(deep, core, (t - 0.76) / 0.14);
  else { col = core; a = 1.0 - clamp((t - 0.90) / 0.10, 0.0, 1.0); }
  // rim stroke
  float rim = (1.0 - smoothstep(0.010, 0.022, abs(dc - 0.457))) * 0.22;
  col = mix(col, vec3(1.0), rim);
  return vec4(col, a * disc);
}

vec4 heightSprite(vec2 c) {
  float dc = distance(c, vec2(0.5));
  float disc = 1.0 - smoothstep(0.462, 0.475, dc);
  if (disc <= 0.0) return vec4(0.0);
  float t = dc / 0.469;
  vec3 col;
  float a = 1.0;
  if (t < 0.45) col = mix(vec3(1.0), vec3(0.812), t / 0.45);
  else if (t < 0.72) col = mix(vec3(0.812), vec3(0.412), (t - 0.45) / 0.27);
  else if (t < 0.90) col = mix(vec3(0.412), vec3(0.067), (t - 0.72) / 0.18);
  else { col = vec3(0.0); a = 1.0 - clamp((t - 0.90) / 0.10, 0.0, 1.0); }
  return vec4(col, a * disc);
}

vec4 tangentSprite(vec2 c) {
  float dc = distance(c, vec2(0.5));
  float disc = 1.0 - smoothstep(0.462, 0.475, dc);
  if (disc <= 0.0) return vec4(0.0);
  float t = dc / 0.469;
  vec3 base = t < 0.62
    ? mix(vec3(0.663, 0.663, 1.0), vec3(0.447, 0.447, 1.0), t / 0.62)
    : mix(vec3(0.447, 0.447, 1.0), vec3(0.125, 0.125, 0.502), (t - 0.62) / 0.38);
  vec2 g = c; // gradient coords
  bool swapAxes = uNormalRemap == 3;
  float gx = swapAxes ? g.y : g.x;
  float gy = swapAxes ? g.x : g.y;
  vec3 xs = uNormalRemap == 1 ? vec3(1.0, 0.502, 1.0) : vec3(0.0, 0.502, 1.0);
  vec3 xe = uNormalRemap == 1 ? vec3(0.0, 0.502, 1.0) : vec3(1.0, 0.502, 1.0);
  vec3 ys = uNormalRemap == 2 ? vec3(0.502, 1.0, 0.502) : vec3(0.502, 0.0, 1.0);
  vec3 ye = uNormalRemap == 2 ? vec3(0.502, 0.0, 1.0) : vec3(0.502, 1.0, 0.502);
  vec3 gxc = mix(xs, xe, gx);
  vec3 gyc = mix(ys, ye, gy);
  vec3 col = base;
  col = 1.0 - (1.0 - col) * (1.0 - gxc * 0.55); // screen @ .55
  col = 1.0 - (1.0 - col) * (1.0 - gyc * 0.48); // screen @ .48
  float rim = (1.0 - smoothstep(0.008, 0.020, abs(dc - 0.461))) * 0.38;
  col = mix(col, vec3(0.722, 0.722, 1.0), rim);
  return vec4(col, disc);
}

float fractalNoise(vec2 p, float featurePx) {
  // uNoiseTex holds tileable fractal noise; sample so features span ~featurePx.
  return texture(uNoiseTex, p / max(featurePx, 2.0) / 3.0).r;
}

// One chamber's contribution: opaque lattice colour + alpha from masks.
vec4 chamber(int i, vec2 scenePx, vec2 u, vec2 aspect, bool isNormal) {
  // The vanish mask bounds every chamber; where it is ~0 the dot sprites and
  // noise can never show, so skip their styling work entirely. This confines
  // per-dot shading to the regions a chamber actually emits into.
  float vanEarly = vanishMask(u, uKind[i], uAngle[i], uOrigin[i], aspect, uVanish[i], uInvert[i] == 1);
  if (vanEarly < 0.004) return vec4(0.0);

  float t = uTime;
  float phase = fract(t / uDur[i]);
  float alphaEnv = 1.0;
  vec2 p = scenePx;

  if (uAnim[i] == 0) {
    p -= uFlow[i] * phase;
  } else {
    // burst: two lattices scaling about the origin with opacity envelopes
    bool reverse = uAnim[i] == 2;
    vec4 acc = vec4(0.0);
    for (int L = 0; L < 2; L++) {
      float ph = fract(phase + (L == 1 ? 0.5 : 0.0));
      float s = reverse ? mix(2.0, 1.0, ph) : mix(1.0, 2.0, ph);
      float env = smoothstep(0.0, 0.22, ph) * (1.0 - smoothstep(0.78, 1.0, ph));
      vec2 originPx = uOrigin[i] * uScene;
      vec2 lp = (scenePx - originPx) / s + originPx;
      vec2 cuv = fract(lp / uCell[i]);
      vec4 sp = isNormal
        ? (uNormalEncoding == 0 ? heightSprite(cuv) : tangentSprite(cuv))
        : inkSprite(cuv);
      float n = fractalNoise(lp, uCell[i] * 3.0);
      float slope = uNoiseSlope[i];
      n = clamp(slope * n + (0.5 - 0.5 * slope), 0.0, 1.0);
      vec3 col = mix(vec3(n), softLight(sp.rgb, vec3(n)), sp.a);
      acc.rgb = mix(acc.rgb, col, env * (1.0 - acc.a * 0.5));
      acc.a = max(acc.a, env);
    }
    // ramp + vanish applied below on accumulated colour
    vec2 rs = rampStops(patternT(u, uKind[i], uAngle[i], uOrigin[i], aspect), uReach[i], uDS[i].x, uDS[i].y, uKind[i], uHalf[i] == 1, uInvert[i] == 1);
    acc.rgb = mix(acc.rgb, softLight(acc.rgb, vec3(rs.x)), rs.y * uRampOp[i]);
    float van = vanishMask(u, uKind[i], uAngle[i], uOrigin[i], aspect, uVanish[i], uInvert[i] == 1);
    acc.a *= van;
    return acc;
  }

  vec2 cuv = fract(p / uCell[i]);
  vec4 sp = isNormal
    ? (uNormalEncoding == 0 ? heightSprite(cuv) : tangentSprite(cuv))
    : inkSprite(cuv);
  float n = fractalNoise(p, uCell[i] * 3.0);
  float slope = uNoiseSlope[i];
  n = clamp(slope * n + (0.5 - 0.5 * slope), 0.0, 1.0);
  vec3 col = mix(vec3(n), softLight(sp.rgb, vec3(n)), sp.a);

  vec2 rs = rampStops(patternT(u, uKind[i], uAngle[i], uOrigin[i], aspect), uReach[i], uDS[i].x, uDS[i].y, uKind[i], uHalf[i] == 1, uInvert[i] == 1);
  col = mix(col, softLight(col, vec3(rs.x)), rs.y * uRampOp[i]);
  float van = vanishMask(u, uKind[i], uAngle[i], uOrigin[i], aspect, uVanish[i], uInvert[i] == 1);
  return vec4(col, alphaEnv * van);
}

float edgeFade(vec2 u, vec2 edge) {
  float fx = edge.x <= 0.001 ? 1.0 : smoothstep(0.0, edge.x, u.x) * smoothstep(1.0, 1.0 - edge.x, u.x);
  float fy = edge.y <= 0.001 ? 1.0 : smoothstep(0.0, edge.y, u.y) * smoothstep(1.0, 1.0 - edge.y, u.y);
  return fx * fy;
}

vec4 layerColor(int layer, vec2 scenePx, vec2 u, vec2 aspect) {
  bool isNormal = layer == 1;
  // Edge fades bound the whole layer — outside them nothing shows, so skip
  // every chamber's work there.
  float fade = edgeFade(u, isNormal ? uNormalEdge : uInkEdge);
  if (fade < 0.004) return vec4(0.0);
  vec4 acc = vec4(0.0);
  int base = layer * MAXC;
  int count = uCount[layer];
  for (int i = 0; i < MAXC; i++) {
    if (i >= count) break;
    vec4 ch = chamber(base + i, scenePx, u, aspect, isNormal);
    acc.rgb = mix(acc.rgb, ch.rgb, ch.a);
    acc.a = ch.a + acc.a * (1.0 - ch.a);
  }
  acc.a *= fade;
  return acc;
}

void main() {
  vec2 scenePx = gl_FragCoord.xy / uScale;
  scenePx.y = uScene.y - scenePx.y; // css y-down
  vec2 u = scenePx / uScene;
  vec2 aspect = uScene / min(uScene.x, uScene.y);
